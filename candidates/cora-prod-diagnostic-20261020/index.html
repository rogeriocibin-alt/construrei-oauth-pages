<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cora PROD · Diagnóstico</title>
<style>body{font:18px system-ui;background:#101c30;color:#eef3ff;padding:24px;max-width:720px;margin:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:14px;margin:8px 0;border-radius:8px}button{background:#ffd269;color:#101c30;border:0;font-weight:700}label{display:block}small{display:block;margin:12px 0;line-height:1.5}</style>
<h1>Cora · Diagnóstico PRODUÇÃO</h1><p>Ambiente REAL · somente leitura. Nenhum pagamento ou alteração financeira será realizado.</p>
<form id="login" hidden><label for="key">Chave de acesso Rogério — Diretor</label><input id="key" name="password" type="password" autocomplete="current-password" required><small>Use a mesma chave da Central CONSTRU-REI. Não é a senha da Cora. A chave será enviada somente ao serviço de autenticação da Central.</small><button id="enter">Entrar e testar Cora</button></form>
<button id="retry" hidden>Testar novamente</button><pre id="result" role="status" aria-live="polite">Verificando sessão…</pre>
<script>
const base='https://yspuaamokjbrosytqjpg.supabase.co/functions/v1/',out=document.getElementById('result'),form=document.getElementById('login'),key=document.getElementById('key'),enter=document.getElementById('enter'),retry=document.getElementById('retry'),SK='crGestaoSession';
function needsLogin(){form.hidden=false;retry.hidden=true;out.textContent='Entre acima para executar o teste nesta mesma tela.'}
async function test(){const session=sessionStorage.getItem(SK)||'';if(!session){needsLogin();return}form.hidden=true;retry.hidden=true;out.textContent='Testando autenticação, saldo e extrato da Cora PRODUÇÃO…';try{const r=await fetch(base+'cr-cora-prod-readonly-candidate-20261020',{headers:{'x-cr-session':session},cache:'no-store',signal:AbortSignal.timeout(60000)});const d=await r.json();if(r.status===401){sessionStorage.removeItem(SK);needsLogin();out.textContent='Sessão expirada ou inválida. Entre novamente acima.';return}const {movements,...safe}=d;out.textContent=JSON.stringify({checked_at:new Date().toISOString(),http_status:r.status,...safe},null,2);retry.hidden=false}catch(e){out.textContent='Falha no diagnóstico: '+e.message;retry.hidden=false}}
form.addEventListener('submit',async e=>{e.preventDefault();enter.disabled=true;out.textContent='Validando acesso à Central…';try{const r=await fetch(base+'central-gestao-api?api=login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:key.value.trim()}),signal:AbortSignal.timeout(10000)});key.value='';const d=await r.json();if(!r.ok||!d.ok||d.role!=='ADMIN_MASTER_ROGERIO'||!d.session)throw Error('Não foi possível validar a chave de diretor. Confira a chave da Central.');sessionStorage.setItem(SK,d.session);await test()}catch(e){key.value='';out.textContent=e.message}finally{enter.disabled=false}});
retry.addEventListener('click',test);test();
</script></html>
