name: Cofre Zero | Trello guarded release
on:
  workflow_run:
    workflows:
      - "Cofre Zero | Trello full recovery candidate"
    types: [completed]
permissions:
  actions: read
  contents: write
  pull-requests: write
jobs:
  promote_only_verified:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate immutable run and exact PR SHA; merge only completed restore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          event=json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          run=event.get("workflow_run") or {}
          repo="rogeriocibin-alt/construrei-oauth-pages"
          expected_sha="ae8ef98f2a8ac6220552e524e9df132d9c253a04"
          if not(
              run.get("id")==38180968850 and
              run.get("workflow_id")==381380663 and
              run.get("conclusion")=="success" and
              run.get("event")=="push" and
              run.get("head_branch")=="checkpoint/cofre-zero-trello-offsite-20261011" and
              run.get("head_sha")==expected_sha and
              (run.get("head_repository") or {}).get("id")==1388982225):
            print("No allowed completed recovery run; no promotion.");raise SystemExit(0)
          base="https://api.github.com/repos/"+repo
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def api(url,method="GET",body=None):
            data=json.dumps(body).encode() if body is not None else None
            req=urllib.request.Request(url,method=method,headers={**headers,**({"Content-Type":"application/json"} if data else {})},data=data)
            with urllib.request.urlopen(req,timeout=30) as r:
              return json.loads(r.read() or "{}")
          jobs=api(base+"/actions/runs/38180968850/jobs?per_page=100")
          assert jobs.get("total_count",0)>=1
          required={
            "Validate OIDC code and offsite Drive configuration",
            "GitHub OIDC authorized read-only Trello archive and restore check",
            "Upload to independent private Drive storage"}
          results={s.get("name"):s.get("conclusion") for j in jobs.get("jobs",[]) for s in j.get("steps",[])}
          if any(results.get(s)!="success" for s in required):raise RuntimeError("Restore CI gate incomplete; PR unchanged")
          pr=api(base+"/pulls/47")
          if not(pr.get("state")=="open" and pr["head"]["sha"]==expected_sha and
                 pr["base"]["ref"]=="main" and pr["head"]["repo"]["id"]==1388982225):
            raise RuntimeError("PR identity mismatch; no promotion")
          if pr.get("draft"):
            gql={"query":"mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}","variables":{"id":pr["node_id"]}}
            result=api("https://api.github.com/graphql","POST",gql)
            if result.get("errors") or result["data"]["markPullRequestReadyForReview"]["pullRequest"]["isDraft"]:
              raise RuntimeError("Failed to mark verified PR ready")
          merged=api(base+"/pulls/47/merge","PUT",{"sha":expected_sha,"merge_method":"squash",
              "commit_title":"Cofre Zero Trello: OIDC, Drive e restauração integral validados"})
          if not merged.get("merged"):raise RuntimeError("GitHub did not confirm merge")
          print("PASS: fully restored Trello candidate #47 merged by exact SHA gate")
          PY
