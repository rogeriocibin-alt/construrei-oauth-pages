name: Cofre Zero | Cloud backup health gate
on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/cofre-zero-health-gate.yml
      - .github/scripts/cofre_governance_guard.py
      - .github/scripts/cr_single_host_zero_incremental_guard.py
      - .github/scripts/cr_ephemeral_publication_gate.py
      - .github/scripts/cr_static_runtime_dependency_audit.py
      - .github/scripts/cr_sql_restore_preflight.py
      - .github/scripts/cr_sql_copy_inventory.py
      - .github/scripts/cr_netlify_historical_provenance_guard.py
      - .github/scripts/cr_cofre_health_latest.py
      - .github/scripts/test_cr_cofre_health_latest.py
      - docs/ADR_ECOSSISTEMA_UNICO_CONTROL_PLANE_SAAS_20261011.md
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - .github/scripts/cofre_trello_bootstrap.py
      - .github/scripts/cofre_trello_capacity_guard.py
      - .github/scripts/cr_history_capacity_guard.py
      - .github/scripts/test_cofre_trello_claims.py
      - gestor-projeto/cofre-mobile/cofre-governance-v1.json
      - .github/scripts/cr_environment_audit.py
      - .github/scripts/cr_f00_f09_staging_smoke.py
      - central-runtime/_shared/cr-checklist-native-20261004.js
      - preview/_shared/cr-checklist-native-20261004.js
      - docs/ARQUITETURA_TRES_AMBIENTES_PLANO_20261011.md
      - docs/AMBIENTES_PREVIEW_INVENTARIO_20261011.json
      - 'preview/**'
      - 'production/**'
      - 'central-runtime/**'
      - gestor-projeto/project-data.json
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cofre-zero-health-gate.yml
      - .github/scripts/cofre_governance_guard.py
      - .github/scripts/cr_single_host_zero_incremental_guard.py
      - .github/scripts/cr_ephemeral_publication_gate.py
      - .github/scripts/cr_static_runtime_dependency_audit.py
      - .github/scripts/cr_sql_restore_preflight.py
      - .github/scripts/cr_sql_copy_inventory.py
      - .github/scripts/cr_netlify_historical_provenance_guard.py
      - .github/scripts/cr_cofre_health_latest.py
      - .github/scripts/test_cr_cofre_health_latest.py
      - docs/ADR_ECOSSISTEMA_UNICO_CONTROL_PLANE_SAAS_20261011.md
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - .github/scripts/cofre_trello_bootstrap.py
      - .github/scripts/cofre_trello_capacity_guard.py
      - .github/scripts/cr_history_capacity_guard.py
      - .github/scripts/test_cofre_trello_claims.py
      - gestor-projeto/cofre-mobile/cofre-governance-v1.json
      - .github/scripts/cr_environment_audit.py
      - .github/scripts/cr_f00_f09_staging_smoke.py
      - central-runtime/_shared/cr-checklist-native-20261004.js
      - preview/_shared/cr-checklist-native-20261004.js
      - docs/ARQUITETURA_TRES_AMBIENTES_PLANO_20261011.md
      - docs/AMBIENTES_PREVIEW_INVENTARIO_20261011.json
      - 'preview/**'
      - 'production/**'
      - 'central-runtime/**'
      - gestor-projeto/project-data.json
permissions:
  contents: read
  actions: read
concurrency:
  group: cofre-zero-health-gate
  cancel-in-progress: false
jobs:
  health:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify independent latest backup evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json,urllib.request,datetime,sys
          content=Path('gestor-projeto/cofre-mobile/index.html').read_text()
          key=re.search(r"const ANON='([^']+)'",content).group(1)
          url="https://yspuaamokjbrosytqjpg.supabase.co/functions/v1/cr-cofre-mobile-status-v1?api=status"
          req=urllib.request.Request(url,headers={"authorization":"Bearer "+key,"apikey":key})
          # Retry bounded transient edge errors; never turn an outage into PASS.
          import urllib.error,time
          for attempt in range(3):
            try:
              with urllib.request.urlopen(req,timeout=20) as r: report=json.load(r)
              break
            except urllib.error.HTTPError as exc:
              if exc.code not in (500,502,503,504) or attempt==2: raise
            except (urllib.error.URLError,TimeoutError):
              if attempt==2: raise
            time.sleep(3*(attempt+1))
          if not report.get('ok'):raise RuntimeError('No live health report')
          github=report['sources']['github']
          sup=report['sources']['supabase']
          # Supabase/private Git proof must be fresh. GitHub metadata from
          # unauthenticated Edge may rate-limit; authenticate direct REST fallback.
          assert sup.get('ok'), 'Supabase/private backup evidence unavailable'
          if not github.get('ok'):
            print('WARNING: Edge GitHub source unavailable; use authenticated GitHub workflow history')
            github={'workflows':[]}
          import sys
          sys.path.insert(0,str(Path(".github/scripts").resolve()))
          from cr_cofre_health_latest import latest
          items=github.get("workflows",[])
          now=datetime.datetime.now(datetime.timezone.utc)
          checks=[]
          for needle in ("Immutable daily full archive","Netlify inventory and published offsite"):
            item,source=latest(items,needle)
            print("EVIDENCE",needle,"source",source,"branch",item.get("branch") if item else "missing")
            if needle=="Immutable daily full archive" and item and item.get("branch") not in (None,"main"):
              print("WARNING: last verified archive is candidate-branch evidence; main scheduled run is not yet proven")
            valid=bool(item and item.get("status")=="completed" and item.get("conclusion")=="success")
            if valid:
              start=datetime.datetime.fromisoformat(item['created_at'].replace('Z','+00:00'))
              valid=(now-start).total_seconds()<72*3600
            checks.append((needle,valid))
          private=sup.get('private_git') or {}
          last=private.get('last_uploaded')
          fresh=False
          if last:
            start=datetime.datetime.fromisoformat(last.replace('Z','+00:00'))
            fresh=(now-start).total_seconds()<72*3600
          checks.append(('private dashboard Git offsite',bool(private.get('stored') and fresh)))
          print('## Cofre Zero — daily cloud checks')
          for name,passed in checks:print(('PASS' if passed else 'FAIL')+' '+name)
          print('Trello attachments: independent recovery candidate, not included as PASS until end-to-end proof')
          errors=[name for name,passed in checks if not passed]
          if errors:raise RuntimeError('Backup gate failed: '+','.join(errors))
          print('PASS: verified evidence, no notebook or Work required')
          PY

  governance:
    name: Inventario canonico e regressao de automacoes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate canonical governance without deleting data
        run: python3 .github/scripts/cofre_governance_guard.py
      - name: Verify existing GitHub scheduled workflows are active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from urllib.error import HTTPError
          repo='rogeriocibin-alt/construrei-oauth-pages'
          names=['cofre-zero-history-full.yml','cofre-netlify-inventory-offsite.yml',
                 'cofre-zero-git-offsite.yml','cofre-trello-weekly-dispatch.yml',
                 'cofre-zero-health-gate.yml']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28'}
          states={}
          for name in names:
              endpoint='https://api.github.com/repos/'+repo+'/actions/workflows/'+name
              req=urllib.request.Request(endpoint,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      item=json.load(response)
              except HTTPError as exc:
                  print('GITHUB_WORKFLOW_STATE_UNAVAILABLE',name,exc.code)
                  raise
              states[name]=item.get('state')
              print('WORKFLOW_STATUS',name,states[name])
          if len(states)!=5 or any(state!='active' for state in states.values()):
              raise RuntimeError('Some existing scheduled backup workflows are not active')
          print('PASS: all five existing GitHub schedules enabled; next event=schedule still unproven')
          PY
      - name: Enforce one-host and no-new-paid-schedule policy (read-only)
        run: python3 .github/scripts/cr_single_host_zero_incremental_guard.py
      - name: Test Cofre Zero history pagination and fail-closed behavior (offline)
        run: python3 .github/scripts/test_cr_cofre_health_latest.py
      - name: Test bounded immutable daily history offline
        run: python3 .github/scripts/cr_history_capacity_guard.py --selftest
      - name: Test read-only historical delta feasibility (synthetic)
        run: python3 .github/scripts/cr_history_delta_feasibility.py --selftest
      - name: Test immutable CAS history append-only contract (synthetic)
        run: |
          python3 -m py_compile .github/scripts/cr_history_cas_append.py
          python3 .github/scripts/cr_history_cas_append.py --selftest
      - name: Probe CAS read-only then pilot immutable seed manifest and recovery
        if: github.event_name == 'pull_request' && github.head_ref == 'cr-cofre-incremental-cas-20261012' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        timeout-minutes: 5
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64"
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p "$HOME/.config/rclone"
          chmod 700 "$HOME/.config/rclone"
          trap 'rm -f "$HOME/.config/rclone/rclone.conf"' EXIT
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          python3 .github/scripts/cr_history_cas_append.py --dry-run |
            python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["mode"]=="dry-run" and not x["approved_for_cutover"]; print("CAS_DRY_RUN=PASS"); print("Source files:",x["source_files"]); print("New immutable bytes GiB:",round(x["estimated_new_object_bytes"]/1024**3,3)); print("Reference seed matches:",x["identical_files"]); print("Expected new objects:",x["new_object_count"]); print("DRY-RUN ONLY: NO WRITES")'
          mkdir -p "$RUNNER_TEMP/cas-pilot"
          python3 .github/scripts/cr_history_cas_append.py --pilot-seed --restore-directory "$RUNNER_TEMP/cas-pilot" |
            python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["snapshot_complete"] and x["append_only"] and x["readback_sql"]==3 and x["readback_storage"]==3; print("PASS: seed-only immutable CAS manifest uploaded and read back"); print("Recovery sample: 3 SQL and 3 Storage objects")'
          python3 .github/scripts/cr_sql_restore_preflight.py --root "$RUNNER_TEMP/cas-pilot" |
            python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["hashes_verified"]==3 and not x["eligible_for_recovery_signoff"]; print("PASS: 3/3 SQL SHA256 from CAS manifest; SQL E2E NOT RESTORED")'
          python3 .github/scripts/cr_sql_copy_inventory.py --root "$RUNNER_TEMP/cas-pilot" |
            python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["copy_headers_total"]>0 and not x["sql_restore_attempted"]; print("PASS: CAS SQL COPY metadata")'
          python3 .github/scripts/cr_history_cas_append.py --verify-manifest 20261011-060021 |
            python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["verified_entries"]==4531 and x["independent_of_current"] and not x["database_replay_passed"]; print("PASS: 4531/4531 immutable historical references resolvable independently of CURRENT"); print("Manifest SHA256:",x["manifest_sha256"])'


      - name: Probe actual history dedup feasibility without writing (candidate only)
        if: github.event_name == 'pull_request' && github.head_ref == 'cr-cofre-cas-delta-feasibility-20261012' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        timeout-minutes: 5
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64" || { echo "::error::Drive config unavailable"; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p "$HOME/.config/rclone"
          chmod 700 "$HOME/.config/rclone"
          trap 'rm -f "$HOME/.config/rclone/rclone.conf"' EXIT
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          python3 .github/scripts/cr_history_delta_feasibility.py | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p["read_only"] and not p["eligible_for_cutover"]; print("READONLY_DEDUP_PROBE=PASS"); print("Source files:",p["source_files"]); print("Unchanged vs immutable seed:",p["identical_files"]); print("Changed/new:",p["changed_or_new_files"]); print("Source missing MD5:",p["source_without_md5_files"]); print("Seed missing MD5:",p["seed_without_md5_files"]); print("Comparable MD5:",p["md5_comparable_files"]); print("Files equal-size:",p["size_equal_files"]); print("Full GiB:",round(p["current_size_bytes"]/1024**3,3)); print("Estimated CAS delta GiB:",round(p["estimated_delta_bytes"]/1024**3,3)); print("NO WRITE, NO CUTOVER")'
      - name: Probe actual Drive capacity in read-only candidate CI
        if: github.event_name == 'pull_request' && github.head_ref == 'cr-cofre-daily-history-capacity-guard-20261012' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        timeout-minutes: 3
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          SOURCE: construrei-drive:CONSTRUREI-BACKUP-AUTO/CURRENT
          ARCHIVE_ROOT: construrei-drive:CONSTRUREI-BACKUP-AUTO/HISTORY_FULL
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64" || { echo "::error::Private Drive configuration is missing"; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p "$HOME/.config/rclone"
          chmod 700 "$HOME/.config/rclone"
          trap 'rm -f "$HOME/.config/rclone/rclone.conf"' EXIT
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          python3 .github/scripts/cr_history_capacity_guard.py |
            python3 -c 'import json,sys; p=json.load(sys.stdin); assert p["gate"]=="PASS" and p["read_only"] and not p["deletion_performed"]; print("PASS: Drive quota and CURRENT/HISTORY_FULL sizes verified read-only"); print("Drive free GiB:",round(p["reported_drive_free_bytes"]/(1024**3),2)); print("New snapshot GiB:",round(p["source_bytes"]/(1024**3),2)); print("Historical archive GiB:",round(p["archived_bytes"]/(1024**3),2)); print("No copy/delete/restore performed")'
      - name: SQL restore preflight and COPY header tests (synthetic only)
        run: |
          python3 .github/scripts/cr_sql_restore_preflight.py --selftest
          python3 .github/scripts/cr_sql_copy_inventory.py --selftest
      - name: Protect historical source candidates for Netlify unpublished sites
        run: python3 .github/scripts/cr_netlify_historical_provenance_guard.py
      - name: Query public workflow history directly to verify pagination fallback
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'.github/scripts')
          from cr_cofre_health_latest import latest
          run,source=latest([],'Immutable daily full archive')
          assert source=='github-workflow-history' and run is not None, 'Archive history not independently retrievable'
          assert run['status']=='completed' and run['conclusion']=='success', 'Latest archive not verified as successful'
          print('PASS: workflow-specific GH history accessible, provenance='+str(run.get('branch')))
          PY
      - name: Verify Trello OIDC identities (offline, no secrets)
        run: |
          python3 -m py_compile .github/scripts/cofre_trello_bootstrap.py
          python3 .github/scripts/test_cofre_trello_claims.py
          python3 .github/scripts/cofre_trello_capacity_guard.py --selftest
      - name: Validate three-environment inventory (read-only)
        run: python3 .github/scripts/cr_environment_audit.py
      - name: Verify byte-identical F00-F09 shared asset candidate
        shell: bash
        run: |
          set -euo pipefail
          source="preview/_shared/cr-checklist-native-20261004.js"
          candidate="central-runtime/_shared/cr-checklist-native-20261004.js"
          test -s "$source"
          test -s "$candidate"
          cmp "$source" "$candidate"
          sha256sum "$source" "$candidate"
          node --check "$source"
          node --check "$candidate"
          python3 - <<'PY'
          from pathlib import Path
          names = ["f00", "f01-canonical-20261001"] + [f"f{i:02d}" for i in range(2, 10)]
          old = "preview/_shared/cr-checklist-native-20261004.js"
          new = "central-runtime/_shared/cr-checklist-native-20261004.js"
          assert len(names) == 10
          for name in names:
              page = Path("central-runtime") / name / "index.html"
              assert page.is_file() and old in page.read_text(encoding="utf-8"), f"Unexpected production contract: {page}"
          assert new not in "".join((Path("central-runtime") / n / "index.html").read_text(encoding="utf-8") for n in names), "Candidate linked before approval"
          print("PASS: 10 live pages unchanged; exact copy and valid JS; no URL cutover")
          PY
      - name: Local ephemeral staging smoke of F00-F09 canonical JS URLs
        run: python3 .github/scripts/cr_f00_f09_staging_smoke.py
      - name: Build isolated ephemeral public package and smoke 39 aliases (no deploy)
        run: python3 .github/scripts/cr_ephemeral_publication_gate.py
      - name: Audit literal first-party asset references (read-only, no cutover)
        run: |
          python3 .github/scripts/cr_static_runtime_dependency_audit.py --selftest
          python3 .github/scripts/cr_static_runtime_dependency_audit.py --enforce


  isolated_pg17_canary:
    name: Laboratorio Postgres 17 efemero — massa sintetica somente
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
    services:
      pg17_fixture:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fixture_tester
          POSTGRES_PASSWORD: synthetic-only-do-not-reuse
          POSTGRES_DB: isolated_fixture
        options: >-
          --health-cmd "pg_isready -U fixture_tester -d isolated_fixture"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Prove disposable PG17 Docker isolation and SQL rollback (no real data)
        shell: bash
        env:
          PG_FIXTURE_CONTAINER: ${{ job.services.pg17_fixture.id }}
        run: |
          set -euo pipefail
          test -n "$PG_FIXTURE_CONTAINER"
          version="$(docker exec "$PG_FIXTURE_CONTAINER" psql -U fixture_tester -d isolated_fixture -Atqc 'show server_version_num' | tr -d '[:space:]')"
          test "$version" -ge 170000
          test "$version" -lt 180000
          docker exec -i "$PG_FIXTURE_CONTAINER" psql -U fixture_tester -d isolated_fixture -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.fixture_restore_demo(id integer PRIMARY KEY, value text NOT NULL);
          INSERT INTO public.fixture_restore_demo VALUES (1, 'synthetic');
          BEGIN;
          UPDATE public.fixture_restore_demo SET value='should_rollback' WHERE id=1;
          ROLLBACK;
          SQL
          value="$(docker exec "$PG_FIXTURE_CONTAINER" psql -U fixture_tester -d isolated_fixture -Atqc 'select value from public.fixture_restore_demo where id=1')"
          test "$value" = "synthetic"
          echo "PASS: isolated PostgreSQL 17 Docker container and synthetic SQL rollback"
          echo "NOT A SQL RESTORE: no roles.sql/schema.sql/data.sql from real Cofre Zero imported"
          echo "No Supabase Auth/Storage bootstrap; no production DB network access or credentials"
