name: Cofre Zero | Git offsite independent
on:
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * 0'
  push:
    branches:
      - checkpoint/cofre-zero-git-offsite-20261011
    paths:
      - .github/workflows/cofre-zero-git-offsite.yml

permissions:
  contents: read

concurrency:
  group: cofre-zero-git-offsite
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      COFRE_GITHUB_READ_TOKEN: ${{ secrets.COFRE_GITHUB_READ_TOKEN }}
    steps:
      - name: Checkout all public Git references
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate cloud destination
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64" || { echo "::error::Missing RCLONE_CONFIG_B64; no changes made"; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone listremotes | grep -qx 'construrei-drive:'
          rclone lsd construrei-drive: >/dev/null

      - name: Create complete Git bundles
        id: bundles
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/cofre-zero-git-offsite"
          mkdir -p "$WORK"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
          git bundle create "$WORK/GITHUB_PUBLIC_ALL_REFS.bundle" --all
          git bundle verify "$WORK/GITHUB_PUBLIC_ALL_REFS.bundle"
          git show-ref > "$WORK/GITHUB_PUBLIC_REFS.txt"
          git rev-parse HEAD > "$WORK/GITHUB_PUBLIC_HEAD.txt"
          if test -n "$COFRE_GITHUB_READ_TOKEN"; then
            export GH_TOKEN="$COFRE_GITHUB_READ_TOKEN"
            gh repo clone rogeriocibin-alt/construrei-dashboard-v4-candidate "$WORK/private.git" -- --mirror
            git -C "$WORK/private.git" bundle create "$WORK/GITHUB_PRIVATE_ALL_REFS.bundle" --all
            git -C "$WORK/private.git" bundle verify "$WORK/GITHUB_PRIVATE_ALL_REFS.bundle"
            git -C "$WORK/private.git" show-ref > "$WORK/GITHUB_PRIVATE_REFS.txt"
            PRIVATE_STATUS="COMPLETE"
            rm -rf "$WORK/private.git"
          else
            PRIVATE_STATUS="BLOCKED_NO_COFRE_GITHUB_READ_TOKEN"
            echo "::warning::Private Git mirror not created: read-only access token is absent"
          fi
          {
            echo "CONSTRU-REI OFFSITE GIT SOURCE BACKUP"
            echo "UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "PUBLIC=COMPLETE"
            echo "PRIVATE=$PRIVATE_STATUS"
            echo "NETLIFY_DEPLOY_ARTIFACTS=OUT_OF_SCOPE_PENDING"
            echo "SOURCE_PROJECT=rogeriocibin-alt"
          } > "$WORK/COVERAGE_STATUS.txt"
          (cd "$WORK" && sha256sum ./*.bundle > SHA256SUMS.txt)
          echo "work=$WORK" >> "$GITHUB_OUTPUT"

      - name: Transfer to private Drive, preserving history
        id: transfer
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(date -u +'%Y%m%d-%H%M%S')-$GITHUB_RUN_ID"
          DEST="construrei-drive:CONSTRUREI-COFRE-ZERO/24_EXTERNAL_SOURCES/GITHUB_GIT_BUNDLES/RUN_$RUN_ID"
          WORK="${{ steps.bundles.outputs.work }}"
          rclone copy "$WORK" "$DEST" --checkers 4 --transfers 2
          rclone check "$WORK" "$DEST" --one-way
          rclone copyto "$DEST/GITHUB_PUBLIC_ALL_REFS.bundle" "$RUNNER_TEMP/restore-public.bundle"
          cmp "$WORK/GITHUB_PUBLIC_ALL_REFS.bundle" "$RUNNER_TEMP/restore-public.bundle"
          git bundle verify "$RUNNER_TEMP/restore-public.bundle"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"
          echo "backup_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Write audit summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Cofre Zero - Git offsite"
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Status: ${{ job.status }}"
            echo "- Destination: ${{ steps.transfer.outputs.dest }}"
            echo "- Public: full Git bundle with references, independent Drive copy and readback"
            echo "- Private: only with read-only COFRE_GITHUB_READ_TOKEN; otherwise flagged as blocked"
            echo "- Netlify deploy artifacts and Edge source require independent recovery coverage"
          } >> "$GITHUB_STEP_SUMMARY"
