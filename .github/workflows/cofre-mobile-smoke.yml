name: Cofre Zero | Mobile status smoke test
on:
  push:
    paths:
      - .github/workflows/cofre-mobile-smoke.yml
      - gestor-projeto/cofre-mobile/index.html
      - gestor-projeto/index.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate static mobile UI and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
            def __init__(self): super().__init__();self.in_script=False;self.parts=[]
            def handle_starttag(self,t,a):
              if t=="script": self.in_script=True
            def handle_endtag(self,t):
              if t=="script": self.in_script=False
            def handle_data(self,d):
              if self.in_script: self.parts.append(d)
          src=Path("gestor-projeto/cofre-mobile/index.html").read_text()
          assert "cofre-mobile-status-v1" in src and "../" in src
          manager=Path("gestor-projeto/index.html").read_text()
          assert 'id="cofreMobileEntry"' in manager and 'href="./cofre-mobile/"' in manager
          parser=Scripts();parser.feed(src)
          script="\n".join(parser.parts)
          assert script.strip() and "addEventListener" in script
          Path("/tmp/cofre-mobile.js").write_text(script)
          print("PASS: HTML, mobile script extracted, owner navigation exists")
          PY
          node --check /tmp/cofre-mobile.js
      - name: Verify live API and real snapshot without privileged credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json,urllib.request
          src=Path("gestor-projeto/cofre-mobile/index.html").read_text()
          anon=re.search(r"const ANON='([^']+)'",src)
          assert anon, "public anon key not found"
          base="https://yspuaamokjbrosytqjpg.supabase.co/functions/v1/cr-cofre-mobile-status-v1"
          headers={"Authorization":"Bearer "+anon.group(1),"apikey":anon.group(1),"Origin":"https://rogeriocibin-alt.github.io","Accept":"application/json"}
          for route in ("health","status"):
            req=urllib.request.Request(base+"?api="+route,headers=headers,method="GET")
            with urllib.request.urlopen(req,timeout=25) as resp:
              body=json.load(resp); assert resp.status==200 and body.get("ok"), "API returned error"
              if route=="health":assert body.get("read_only") is True
              if route=="status":
                sources=body["sources"]
                assert sources["supabase"]["ok"], "No fresh Supabase status"
                assert sources["github"]["ok"], "No fresh GitHub status"
                assert sources["supabase"]["latest"]["page_count"]>=1
                print("PASS: Cloud status API, persisted inventory and GitHub actions")
          PY
      - name: Test method guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,urllib.request,urllib.error
          s=Path("gestor-projeto/cofre-mobile/index.html").read_text()
          key=re.search(r"const ANON='([^']+)'",s).group(1)
          req=urllib.request.Request("https://yspuaamokjbrosytqjpg.supabase.co/functions/v1/cr-cofre-mobile-status-v1?api=status",
            headers={"Authorization":"Bearer "+key,"apikey":key},method="POST",data=b"{}")
          try:urllib.request.urlopen(req,timeout=20);raise RuntimeError("POST unexpectedly accepted")
          except urllib.error.HTTPError as e:
            assert e.code in (401,403,405),f"Unexpected POST status: {e.code}"
          print("PASS: backend rejected mutation request")
          PY
