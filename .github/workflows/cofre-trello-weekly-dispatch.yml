name: Cofre Zero | Scheduled Trello offsite dispatch
on:
  schedule:
    - cron: '45 7 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cofre-trello-weekly-dispatch.yml
permissions:
  contents: read
  pull-requests: read
  actions: write
concurrency:
  group: cofre-trello-scheduled-dispatch
  cancel-in-progress: false
jobs:
  dispatch_if_verified:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Dispatch only after verified Trello recovery PR is merged
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          base="https://api.github.com/repos/rogeriocibin-alt/construrei-oauth-pages"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def get(path):
            req=urllib.request.Request(base+path,headers=headers)
            with urllib.request.urlopen(req,timeout=25) as r:return json.load(r)
          pr=get("/pulls/47")
          if not pr.get("merged_at"):
            print("SKIP: full Trello binary restore not yet verified and merged; never claim 100%.")
            raise SystemExit(0)
          workflow=get("/actions/workflows/cofre-zero-trello-offsite.yml")
          assert workflow.get("state")=="active"
          body=json.dumps({"ref":"main"}).encode()
          req=urllib.request.Request(base+"/actions/workflows/cofre-zero-trello-offsite.yml/dispatches",
               data=body,headers={**headers,"content-type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=25) as r:
            assert r.status in (200,201,204)
          print("PASS: verified Trello backup workflow dispatched on main")
          PY
