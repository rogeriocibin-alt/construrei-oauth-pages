name: Cofre Zero | Netlify static offsite candidate
on:
  workflow_dispatch:
  push:
    branches:
      - checkpoint/cofre-zero-netlify-offsite-20261011
    paths:
      - .github/workflows/cofre-zero-netlify-static.yml

permissions:
  contents: read

concurrency:
  group: cofre-zero-netlify-static
  cancel-in-progress: false

jobs:
  static-readonly:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and validate inputs
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/cofre_netlify_static.py
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "::error::NETLIFY_AUTH_TOKEN missing; no Netlify data was exported"; exit 2; }
          test -n "$RCLONE_CONFIG_B64" || { echo "::error::RCLONE_CONFIG_B64 missing"; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -qq -y rclone
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone lsd construrei-drive: >/dev/null
      - name: Read-only export and SHA verification of all seven published static sites
        env:
          COFRE_OUTPUT_DIR: ${{ runner.temp }}/netlify-static
        run: |
          set -euo pipefail
          python3 .github/scripts/cofre_netlify_static.py
      - name: Publish immutable external snapshot and verify by readback
        env:
          COFRE_OUTPUT_DIR: ${{ runner.temp }}/netlify-static
        run: |
          set -euo pipefail
          SRC="$COFRE_OUTPUT_DIR"
          RUN_ID="$(date -u +'%Y%m%d-%H%M%S')-$GITHUB_RUN_ID"
          DEST="construrei-drive:CONSTRUREI-COFRE-ZERO/24_EXTERNAL_SOURCES/NETLIFY_STATIC_OFFSITE/RUN_$RUN_ID"
          ( cd "$SRC" && sha256sum ./*.zip > SHA256SUMS.txt )
          rclone copy "$SRC" "$DEST" --transfers 2 --checkers 4
          rclone check "$SRC" "$DEST" --one-way
          rclone copyto "$DEST/NETLIFY_STATIC_MANIFEST.json" "$RUNNER_TEMP/NETLIFY_STATIC_MANIFEST_readback.json"
          cmp "$SRC/NETLIFY_STATIC_MANIFEST.json" "$RUNNER_TEMP/NETLIFY_STATIC_MANIFEST_readback.json"
          echo "Verified all seven static site bundles in Drive"
      - name: Report scope and result
        if: always()
        run: |
          echo "## Netlify static offsite candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Static assets only. Functions, site configuration, env secrets, DNS, and historical deploys remain OUT OF SCOPE." >> "$GITHUB_STEP_SUMMARY"
          echo "- No Netlify production change is performed." >> "$GITHUB_STEP_SUMMARY"
