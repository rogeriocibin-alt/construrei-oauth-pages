name: Cofre Zero | Netlify static offsite candidate
on:
  workflow_dispatch:
  push:
    branches:
      - checkpoint/cofre-zero-netlify-offsite-20261011
    paths:
      - .github/workflows/cofre-zero-netlify-static.yml

permissions:
  contents: read

concurrency:
  group: cofre-zero-netlify-static
  cancel-in-progress: false

jobs:
  static-readonly:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and validate inputs
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/cofre_netlify_static.py .github/scripts/cofre_netlify_restore.py
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "::error::NETLIFY_AUTH_TOKEN missing; no Netlify data was exported"; exit 2; }
          test -n "$RCLONE_CONFIG_B64" || { echo "::error::RCLONE_CONFIG_B64 missing"; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -qq -y rclone
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone lsd construrei-drive: >/dev/null
      - name: Inspect available deploys without changing Netlify
        env:
          COFRE_OUTPUT_DIR: ${{ runner.temp }}/netlify-static
        run: |
          python3 - <<'PY'
          import sys,json,urllib.error
          sys.path.insert(0,'.github/scripts')
          import cofre_netlify_static as c
          for name,sid in c.SITES:
              try:
                  data,_=c.api('/sites/'+sid+'/deploys?per_page=100&page=1')
                  deploys=json.loads(data)
                  print('DEPLOY_DIAGNOSTIC',name,'returned',len(deploys),
                    json.dumps([{k:d.get(k) for k in ('id','state','published_at','context')} for d in deploys[:5]]))
                  files=c.listing(sid)
                  print('FILES_DIAGNOSTIC',name,'files',len(files))
              except urllib.error.HTTPError as e:
                  print('DIAGNOSTIC_HTTP',name,e.code)
              except Exception as e:
                  print('DIAGNOSTIC_ERROR',name,type(e).__name__)
          PY
      - name: Read-only export and SHA verification of all seven published static sites
        id: export
        continue-on-error: true
        env:
          COFRE_OUTPUT_DIR: ${{ runner.temp }}/netlify-static
        run: |
          set -euo pipefail
          python3 .github/scripts/cofre_netlify_static.py
      - name: Publish immutable external snapshot and verify by readback
        env:
          COFRE_OUTPUT_DIR: ${{ runner.temp }}/netlify-static
        run: |
          set -euo pipefail
          SRC="$COFRE_OUTPUT_DIR"
          RUN_ID="$(date -u +'%Y%m%d-%H%M%S')-$GITHUB_RUN_ID"
          DEST="construrei-drive:CONSTRUREI-COFRE-ZERO/24_EXTERNAL_SOURCES/NETLIFY_STATIC_OFFSITE/RUN_$RUN_ID"
          ( cd "$SRC" && sha256sum ./*.zip > SHA256SUMS.txt )
          rclone copy "$SRC" "$DEST" --immutable --transfers 2 --checkers 4
          rclone check "$SRC" "$DEST" --one-way
          rclone copyto "$DEST/NETLIFY_STATIC_MANIFEST.json" "$RUNNER_TEMP/NETLIFY_STATIC_MANIFEST_readback.json"
          cmp "$SRC/NETLIFY_STATIC_MANIFEST.json" "$RUNNER_TEMP/NETLIFY_STATIC_MANIFEST_readback.json"
          RECOVER="$RUNNER_TEMP/netlify-drive-readback"
          rclone copy "$DEST" "$RECOVER" --transfers 2 --checkers 4
          cmp "$SRC/NETLIFY_STATIC_MANIFEST.json" "$RECOVER/NETLIFY_STATIC_MANIFEST.json"
          ( cd "$RECOVER" && sha256sum --check SHA256SUMS.txt )
          python3 .github/scripts/cofre_netlify_restore.py "$RECOVER" "$RUNNER_TEMP/netlify-isolated-restored"
          rclone copy "$RECOVER/RESTORE_REPORT.json" "$DEST" --immutable
          rclone copyto "$DEST/RESTORE_REPORT.json" "$RUNNER_TEMP/RESTORE_REPORT_READBACK.json"
          cmp "$RECOVER/RESTORE_REPORT.json" "$RUNNER_TEMP/RESTORE_REPORT_READBACK.json"
          echo "Recovered available static bundles from Drive; seven-site coverage checked separately"
          echo "- Private Drive snapshot: NETLIFY_STATIC_OFFSITE/RUN_$RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/netlify-drive-readback/RESTORE_REPORT.json")); print("- Restore:",r["status"],str(r["site_count"])+"/7 sites,",r["file_count"],"files")' >> "$GITHUB_STEP_SUMMARY"
      - name: Require complete seven-site coverage
        env:
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
        run: |
          test "$EXPORT_OUTCOME" = success || { echo "::error::Partial backup only; missing sites remain blocked. Do not homologate seven-site coverage."; exit 1; }
      - name: Report scope and result
        if: always()
        run: |
          echo "## Netlify static offsite candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Static assets only. Functions, site configuration, env secrets, DNS, and historical deploys remain OUT OF SCOPE." >> "$GITHUB_STEP_SUMMARY"
          echo "- No Netlify production change is performed." >> "$GITHUB_STEP_SUMMARY"
