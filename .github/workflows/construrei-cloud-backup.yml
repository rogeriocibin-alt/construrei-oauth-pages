name: CONSTRU-REI Cloud Backup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only inspection of delta/capacity; never performs a backup"
        required: true
        type: choice
        options:
          - inspect
        default: inspect
  pull_request:
    paths:
      - .github/scripts/cr_cofre_failover_guard.py
      - .github/workflows/construrei-cloud-backup.yml
  push:
    # Single bounded read-only diagnostic run on this internal candidate ONLY.
    branches:
      - candidate/cofre-github-failover-zero-new-cost-20261013
    paths:
      - .github/workflows/construrei-cloud-backup.yml

permissions:
  contents: read

concurrency:
  group: construrei-cloud-backup
  cancel-in-progress: false

jobs:
  failover-policy-selftest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm fail-closed policy with synthetic data only
        run: |
          python3 -m py_compile .github/scripts/cr_cofre_failover_guard.py
          python3 .github/scripts/cr_cofre_failover_guard.py --selftest

  inspect-remote-delta:
    # Trusted owner-controlled branch push; fork PRs never obtain this secret.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'inspect') || (github.event_name == 'push' && github.ref_name == 'candidate/cofre-github-failover-zero-new-cost-20261013') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare metadata-only inventory tools
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64" || { echo "::error::Existing remote config unavailable"; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p "$HOME/.config/rclone"
          chmod 700 "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone listremotes | grep -qx 'construrei-drive:'
          rclone listremotes | grep -qx 'construrei-s3:'
      - name: Compare metadata only; never download objects or alter Drive
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -rf "$RUNNER_TEMP/cofre-metadata"; rm -f "$HOME/.config/rclone/rclone.conf"' EXIT
          mkdir -m 700 "$RUNNER_TEMP/cofre-metadata"
          WORK="$RUNNER_TEMP/cofre-metadata"
          SRC="construrei-s3:"
          DST="construrei-drive:CONSTRUREI-BACKUP-AUTO/CURRENT"
          # Keep names, object paths, and hashes inside runner memory/files, NEVER logs/artifacts.
          rclone lsjson "$SRC" --recursive --files-only --hash > "$WORK/source.json" 2>"$WORK/source.err" || { echo "::error::Supabase S3 metadata unavailable"; exit 2; }
          rclone lsjson "$DST/06_STORAGE" --recursive --files-only --hash > "$WORK/destination.json" 2>"$WORK/destination.err" || { echo "::error::Drive metadata unavailable"; exit 2; }
          rclone lsjson "$DST/03_DATABASE" --files-only > "$WORK/database.json" 2>"$WORK/database.err" || { echo "::error::Historical SQL metadata unavailable"; exit 2; }
          rclone about construrei-drive: --json > "$WORK/quota.json" 2>"$WORK/quota.err" || { echo "::error::Drive quota unavailable"; exit 2; }
          rclone cat "$DST/BACKUP_STATUS.txt" > "$WORK/status.txt" 2>"$WORK/status.err" || { echo "::error::No trusted CURRENT marker"; exit 2; }
          python3 - "$WORK" <<'PY'
          import json, pathlib, sys
          work=pathlib.Path(sys.argv[1])
          quota=json.loads((work/'quota.json').read_text())
          free=quota.get('free')
          sql=json.loads((work/'database.json').read_text())
          files={p.get('Path'):p.get('Size') for p in sql}
          if type(free) is not int or free < 0:
              raise SystemExit("BLOCK: unknown Drive free quota")
          if set(files) != {'roles.sql','schema.sql','data.sql'} or any(type(v) is not int or v<=0 for v in files.values()):
              raise SystemExit("BLOCK: incomplete historical SQL")
          # Prior SQL bytes + 100% growth margin; only a planning bound, not actual egress.
          estimated=sum(files.values())*2
          (work/'free.txt').write_text(str(free))
          (work/'sql-estimate.txt').write_text(str(estimated))
          print('Historical SQL metadata: 3/3; estimate includes 100% safety margin')
          PY
          python3 .github/scripts/cr_cofre_failover_guard.py \
            --estimate-only \
            --status-file "$WORK/status.txt" \
            --source-inventory-json "$WORK/source.json" \
            --destination-inventory-json "$WORK/destination.json" \
            --database-export-estimate-bytes "$(cat "$WORK/sql-estimate.txt")" \
            --max-egress-bytes 536870912 \
            --drive-free-bytes "$(cat "$WORK/free.txt")"
          echo "No backup executed. Cloud Run source status still must be verified separately."
      - name: Confirm no real backup job runs from this inspection
        run: echo "INSPECT_ONLY; no new schedule, Cloud, full copy, or archive"

  backup:
    # Disabled until the existing Cloud Run producer is proven quiescent and the
    # legacy full-copy steps below are replaced with verified incremental runtime.
    if: ${{ false && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PROJECT_REF: yspuaamokjbrosytqjpg
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "Missing SUPABASE_DB_URL"; exit 2; }
          test -n "$RCLONE_CONFIG_B64" || { echo "Missing RCLONE_CONFIG_B64"; exit 2; }

      - name: Prepare tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y rclone curl ca-certificates gnupg
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | gpg --dearmor \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-17
          node --version
          /usr/lib/postgresql/17/bin/pg_dump --version
          rclone version | head -n 1

      - name: Restore protected rclone configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone listremotes | grep -qx 'construrei-drive:'
          rclone listremotes | grep -qx 'construrei-s3:'

      - name: Prepare isolated workspace
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(date -u +'%Y%m%d-%H%M%S')"
          ROOT="$RUNNER_TEMP/CONSTRUREI-BACKUP-AUTO"
          WORK="$ROOT/WORK/DAILY_$RUN_ID"
          mkdir -p "$WORK/03_DATABASE" "$WORK/06_STORAGE" "$RUNNER_TEMP/supabase/.temp"
          printf '%s\n' "$PROJECT_REF" > "$RUNNER_TEMP/supabase/.temp/project-ref"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "work=$WORK" >> "$GITHUB_OUTPUT"

      - name: Connectivity preflight
        working-directory: ${{ runner.temp }}/supabase
        shell: bash
        run: |
          set -euo pipefail
          rclone lsd construrei-drive: >/dev/null
          rclone lsd construrei-s3: >/dev/null

      - name: Preserve validated database roles snapshot
        shell: bash
        run: |
          set -euo pipefail
          rclone copyto "construrei-drive:CONSTRUREI-COFRE-ZERO/03_DATABASE/roles.sql" \
            "${{ steps.prep.outputs.work }}/03_DATABASE/roles.sql"

      - name: Dump database schema
        shell: bash
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema-only \
            --quote-all-identifiers \
            --exclude-schema "information_schema|pg_*|_analytics|_realtime|_supavisor|auth|etl|extensions|pgbouncer|realtime|storage|supabase_functions|supabase_migrations|cron|dbdev|graphql|graphql_public|net|pgmq|pgsodium|pgsodium_masks|pgtle|repack|tiger|tiger_data|timescaledb_*|_timescaledb_*|topology|vault" \
          | sed -E 's/^\\(un)?restrict .*$/-- &/' \
          | sed -E 's/^CREATE SCHEMA "/CREATE SCHEMA IF NOT EXISTS "/' \
          | sed -E 's/^CREATE TABLE "/CREATE TABLE IF NOT EXISTS "/' \
          | sed -E 's/^CREATE SEQUENCE "/CREATE SEQUENCE IF NOT EXISTS "/' \
          | sed -E 's/^CREATE VIEW "/CREATE OR REPLACE VIEW "/' \
          | sed -E 's/^CREATE FUNCTION "/CREATE OR REPLACE FUNCTION "/' \
          | sed -E 's/^CREATE TRIGGER "/CREATE OR REPLACE TRIGGER "/' \
          | sed -E 's/^CREATE PUBLICATION "supabase_realtime/-- &/' \
          | sed -E 's/^CREATE EVENT TRIGGER /-- &/' \
          | sed -E 's/^         WHEN TAG IN /-- &/' \
          | sed -E 's/^   EXECUTE FUNCTION /-- &/' \
          | sed -E 's/^ALTER EVENT TRIGGER /-- &/' \
          | sed -E 's/^ALTER PUBLICATION "supabase_realtime_/-- &/' \
          | sed -E 's/^ALTER FOREIGN DATA WRAPPER (.+) OWNER TO /-- &/' \
          | sed -E 's/^ALTER DEFAULT PRIVILEGES FOR ROLE "supabase_admin"/-- &/' \
          | sed -E 's/^GRANT ALL ON FOREIGN DATA WRAPPER (.+) TO "postgres" WITH GRANT OPTION/-- &/' \
          | sed -E "s/^GRANT (.+) ON (.+) \"(information_schema|pg_*|_analytics|_realtime|_supavisor|auth|etl|extensions|pgbouncer|realtime|storage|supabase_functions|supabase_migrations|cron|dbdev|graphql|graphql_public|net|pgmq|pgsodium|pgsodium_masks|pgtle|repack|tiger|tiger_data|timescaledb_*|_timescaledb_*|topology|vault)\"/-- &/" \
          | sed -E "s/^REVOKE (.+) ON (.+) \"(information_schema|pg_*|_analytics|_realtime|_supavisor|auth|etl|extensions|pgbouncer|realtime|storage|supabase_functions|supabase_migrations|cron|dbdev|graphql|graphql_public|net|pgmq|pgsodium|pgsodium_masks|pgtle|repack|tiger|tiger_data|timescaledb_*|_timescaledb_*|topology|vault)\"/-- &/" \
          | sed -E 's/^(CREATE EXTENSION IF NOT EXISTS "pg_tle").+/\1;/' \
          | sed -E 's/^(CREATE EXTENSION IF NOT EXISTS "pgsodium").+/\1;/' \
          | sed -E 's/^(CREATE EXTENSION IF NOT EXISTS "pgmq").+/\1;/' \
          | sed -E 's/^COMMENT ON EXTENSION (.+)/-- &/' \
          | sed -E 's/^CREATE POLICY "cron_job_/-- &/' \
          | sed -E 's/^ALTER TABLE "cron"/-- &/' \
          | sed -E 's/^SET transaction_timeout = 0;/-- &/' \
          | sed -E "/^--/d" \
          > "${{ steps.prep.outputs.work }}/03_DATABASE/schema.sql"

      - name: Dump database data
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "SET session_replication_role = replica;"
            /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
              --data-only \
              --quote-all-identifiers \
              --exclude-schema "information_schema|pg_*|graphql|graphql_public|pgsodium|pgsodium_masks|pgtle|repack|tiger|tiger_data|timescaledb_*|_timescaledb_*|topology|vault|etl|extensions|pgbouncer|realtime|supabase_migrations|_analytics|_realtime|_supavisor" \
              --exclude-table "auth.schema_migrations" \
              --exclude-table "storage.migrations" \
              --exclude-table "supabase_functions.migrations" \
              --schema "*" \
              --exclude-table '"storage"."buckets_vectors"' \
              --exclude-table '"storage"."vector_indexes"' \
            | sed -E 's/^\\(un)?restrict .*$/-- &/'
            echo "RESET ALL;"
          } > "${{ steps.prep.outputs.work }}/03_DATABASE/data.sql"

      - name: Copy Supabase Storage
        shell: bash
        run: |
          set -euo pipefail
          rclone copy construrei-s3: "${{ steps.prep.outputs.work }}/06_STORAGE" --create-empty-src-dirs
          rclone check construrei-s3: "${{ steps.prep.outputs.work }}/06_STORAGE"

      - name: Create integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.prep.outputs.work }}"
          find 03_DATABASE 06_STORAGE -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          DB_COUNT="$(find 03_DATABASE -type f | wc -l | tr -d ' ')"
          STORAGE_COUNT="$(find 06_STORAGE -type f | wc -l | tr -d ' ')"
          {
            echo "CONSTRU-REI CLOUD BACKUP"
            echo "UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "RUN_ID: ${{ steps.prep.outputs.run_id }}"
            echo "DATABASE_FILES: $DB_COUNT"
            echo "STORAGE_FILES: $STORAGE_COUNT"
            echo "SOURCE_PROJECT: $PROJECT_REF"
          } > BACKUP_STATUS.txt

      - name: Publish immutable, complete daily recovery point first
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.prep.outputs.run_id }}"
          WORK="${{ steps.prep.outputs.work }}"
          SNAPSHOT="construrei-drive:CONSTRUREI-BACKUP-AUTO/HISTORY_FULL/$RUN_ID"
          # HISTORY/ is legacy *changed-before-update* data, not a complete daily snapshot.
          # Never overwrite or purge that legacy archive.
          # Upload new point-in-time data before touching CURRENT.
          rclone copy "$WORK" "$SNAPSHOT" --immutable --create-empty-src-dirs --checkers 8 --transfers 4
          rclone check "$WORK" "$SNAPSHOT"
          rclone copyto "$SNAPSHOT/BACKUP_STATUS.txt" "$RUNNER_TEMP/archive-status-readback.txt"
          cmp "$WORK/BACKUP_STATUS.txt" "$RUNNER_TEMP/archive-status-readback.txt"
          rclone copyto "$SNAPSHOT/SHA256SUMS.txt" "$RUNNER_TEMP/archive-sha-readback.txt"
          cmp "$WORK/SHA256SUMS.txt" "$RUNNER_TEMP/archive-sha-readback.txt"
          echo "Immutable full recovery point verified: HISTORY_FULL/$RUN_ID"

      - name: Update CURRENT only after full history passes verification
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.prep.outputs.run_id }}"
          WORK="${{ steps.prep.outputs.work }}"
          # Preserve replaced/deleted CURRENT files without mixing them into HISTORY_FULL.
          rclone sync "$WORK" construrei-drive:CONSTRUREI-BACKUP-AUTO/CURRENT \
            --backup-dir "construrei-drive:CONSTRUREI-BACKUP-AUTO/HISTORY_DELTAS/$RUN_ID" \
            --create-empty-src-dirs
          rclone check "$WORK" construrei-drive:CONSTRUREI-BACKUP-AUTO/CURRENT

      - name: Restore drill from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ steps.prep.outputs.work }}"
          RESTORE="$RUNNER_TEMP/RESTORE-DRILL-${{ steps.prep.outputs.run_id }}"
          REMOTE="construrei-drive:CONSTRUREI-BACKUP-AUTO/CURRENT"
          mkdir -p "$RESTORE/03_DATABASE"

          rclone copy "$REMOTE/03_DATABASE" "$RESTORE/03_DATABASE" --create-empty-src-dirs

          for f in roles.sql schema.sql data.sql; do
            test "$(sha256sum "$WORK/03_DATABASE/$f" | awk '{print $1}')" = \
                 "$(sha256sum "$RESTORE/03_DATABASE/$f" | awk '{print $1}')"
          done

          mapfile -d '' SAMPLES < <(find "$WORK/06_STORAGE" -type f -print0 | sort -z | head -z -n 3)
          test "${#SAMPLES[@]}" -eq 3

          i=0
          for src in "${SAMPLES[@]}"; do
            i=$((i+1))
            rel="${src#"$WORK/06_STORAGE/"}"
            dest="$RESTORE/storage-sample-$i"
            rclone copyto "$REMOTE/06_STORAGE/$rel" "$dest"
            test "$(sha256sum "$src" | awk '{print $1}')" = "$(sha256sum "$dest" | awk '{print $1}')"
          done

          {
            echo "RESTORE_DRILL=PASS"
            echo "DATABASE=3/3 SHA256 MATCH"
            echo "STORAGE=3/3 SHA256 MATCH"
            echo "UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } | tee "$RESTORE/RESTORE_RESULT.txt"

      - name: Final summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CONSTRU-REI Cloud Backup"
            echo ""
            echo "- Run: ${{ steps.prep.outputs.run_id }}"
            echo "- Project: $PROJECT_REF"
            echo "- Google Drive destination: CONSTRUREI-BACKUP-AUTO/CURRENT"
            echo "- History destination: CONSTRUREI-BACKUP-AUTO/HISTORY/${{ steps.prep.outputs.run_id }}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
