name: Central Canonical Guard

on:
  push:
    branches: [main]
    paths:
      - 'production/central-homologada-20261001/index.html'
      - 'central-canonical/current/**'
      - 'central-canonical/VISUAL_IDENTITY_CANONICAL_20261002.md'
      - 'central-runtime/**/*.html'
      - 'central-runtime/ui/**'
      - 'central/presentation.html'
      - '.github/workflows/central-canonical-guard.yml'
      - '.github/scripts/cr_central_full_scope_audit.py'
      - 'docs/official-links-registry.json'
      - 'production/central-operacional-v2-ux-r1-2-homologada-20261005/**'
      - 'production/dashboard-financeiro-v4/**'
      - 'gestor-projeto/index.html'
      - 'preview/app-gabi-v21-parecer-logo-20261008/**'
      - 'checklist-operacional/**'
      - 'pendencias-app/**'
      - 'pendencias-wizy-flow/**'
      - 'pendencias-eder-agora/**'
      - 'apresentacao/**'
      - 'documentacao/**'
      - 'diretoria-master/**'
      - 'admin-tecnico/**'
  pull_request:
    paths:
      - 'production/central-homologada-20261001/index.html'
      - 'central-canonical/current/**'
      - 'central-canonical/VISUAL_IDENTITY_CANONICAL_20261002.md'
      - 'central-runtime/**/*.html'
      - 'central-runtime/ui/**'
      - 'central/presentation.html'
      - '.github/workflows/central-canonical-guard.yml'
      - '.github/scripts/cr_central_full_scope_audit.py'
      - 'docs/official-links-registry.json'
      - 'production/central-operacional-v2-ux-r1-2-homologada-20261005/**'
      - 'production/dashboard-financeiro-v4/**'
      - 'gestor-projeto/index.html'
      - 'preview/app-gabi-v21-parecer-logo-20261008/**'
      - 'checklist-operacional/**'
      - 'pendencias-app/**'
      - 'pendencias-wizy-flow/**'
      - 'pendencias-eder-agora/**'
      - 'apresentacao/**'
      - 'documentacao/**'
      - 'diretoria-master/**'
      - 'admin-tecnico/**'

permissions:
  contents: read

jobs:
  protect-central-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify homologated HTML is byte-identical
        shell: bash
        run: |
          actual="$(git hash-object production/central-homologada-20261001/index.html)"
          # Hash from owner-confirmed homologation commit a5bc15c3adc297 (2026-10-04).
          # Main file remains byte-identical to that authorized promotion.
          expected="a4d58cf22090e3aa51010720c27978ec476335a5"
          test "$actual" = "$expected" || {
            echo "ERROR: homologated Central baseline was modified."
            echo "Expected $expected, got $actual"
            exit 1
          }
      - name: Reject legacy production routing
        shell: bash
        run: |
          if grep -Eqi 'checkpoint-v270|central-recovery|preview/central-approved-router-candidate-20261001' central-canonical/current/centro-operacoes/index.ts; then
            echo "ERROR: legacy Central reference reintroduced into canonical production router."
            exit 1
          fi
          grep -q 'FORWARD_ONLY_NO_LEGACY_FALLBACK' central-canonical/current/centro-operacoes/index.ts

  protect-visual-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical product design system is unchanged
        shell: bash
        run: |
          actual="$(git hash-object central-runtime/ui/cr-product-design-20260930.css)"
          expected="15826e21af6cddd1e36ecdd85e9d7dce529f0dcb"
          test "$actual" = "$expected" || {
            echo "ERROR: canonical visual identity stylesheet changed without re-homologation."
            echo "Expected $expected, got $actual"
            exit 1
          }
      - name: Require canonical design system in runtime pages
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            case "$file" in
              central-runtime/f01/index.html) continue ;;
            esac
            if ! grep -q 'cr-product-design-20260930.css' "$file"; then
              echo "ERROR: runtime page does not load the canonical design system: $file"
              failed=1
            fi
          done < <(find central-runtime -type f -name '*.html' -print0)
          test "$failed" -eq 0
      - name: Require canonical design system in institutional presentation
        shell: bash
        run: |
          grep -q 'cr-product-design-20260930.css' central/presentation.html || {
            echo "ERROR: institutional presentation bypasses the canonical design system."
            exit 1
          }

  verify-full-central-scope:
    name: Contratos oficiais da Central inteira (links + funcoes)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit all official aliases and embedded business modules
        run: python3 .github/scripts/cr_central_full_scope_audit.py
