name: Central Canonical Guard

on:
  push:
    branches: [main]
    paths:
      - 'production/central-homologada-20261001/index.html'
      - 'central-canonical/current/**'
      - 'central-canonical/VISUAL_IDENTITY_CANONICAL_20261002.md'
      - 'central-runtime/**/*.html'
      - 'central-runtime/ui/**'
      - 'central/presentation.html'
      - '.github/workflows/central-canonical-guard.yml'
      - '.github/scripts/cr_central_full_scope_audit.py'
      - '.github/scripts/cr_ecosystem_contract_audit.py'
      - '.github/scripts/cr_public_router_liveness_audit.py'
      - '.github/scripts/cr_flow_public_client_perimeter_guard.py'
      - 'security/contracts/wz01-flow-authorization*.mjs'
      - 'production/flow-canonical-20261001/**'
      - 'docs/CANONICAL_RULES_MASTER_INDEX_V1_20261007.md'
      - 'gestor-projeto/project-data.json'
      - 'gestor-projeto/version.json'
      - 'gestor-projeto/sw.js'
      - 'docs/AMBIENTES_PREVIEW_INVENTARIO_20261011.json'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - 'docs/official-links-registry.json'
      - 'production/central-operacional-v2-ux-r1-2-homologada-20261005/**'
      - 'production/dashboard-financeiro-v4/**'
      - 'production/dashboard-financeiro-v12-homologada-20261022/**'
      - 'gestor-projeto/index.html'
      - 'preview/app-gabi-v21-parecer-logo-20261008/**'
      - 'checklist-operacional/**'
      - 'pendencias-app/**'
      - 'pendencias-wizy-flow/**'
      - 'pendencias-eder-agora/**'
      - 'apresentacao/**'
      - 'documentacao/**'
      - 'diretoria-master/**'
      - 'admin-tecnico/**'
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  protect-central-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ORÇA-REI R5 auth, model and PDF preservation (offline)
        shell: bash
        run: |
          node --version
          node .github/scripts/test_orca_r5_oauth_preview.cjs
      - name: Probe public Supabase Auth settings without credentials or changes
        shell: bash
        run: |
          node - <<'JS'
          (async()=>{
            const url="https://yspuaamokjbrosytqjpg.supabase.co/auth/v1/settings";
            try {
              const r=await fetch(url,{headers:{"apikey":"sb_publishable_CKRScNxEWURNGv4Mz269hg_zdQEmwzS"},signal:AbortSignal.timeout(10000)});
              const x=await r.json();
              const provider=x.external?.google??x.external?.google_enabled??x.providers?.google??null;
              console.log(JSON.stringify({probe:"ORCA_R5_GOOGLE_PROVIDER",http:r.status,google_enabled:provider,read_only:true,credentials_disclosed:false}));
            } catch(e){console.log(JSON.stringify({probe:"ORCA_R5_GOOGLE_PROVIDER",result:"INDETERMINATE",error_type:e.name}))}
          })();
          JS
      - name: Verify R5 Gemini endpoint rejects unauthenticated requests without calling model
        shell: bash
        run: |
          node - <<'JS'
          (async()=>{
            const endpoint="https://yspuaamokjbrosytqjpg.supabase.co/functions/v1/cr-orca-rei-gemini-r5-restricted-20261013";
            const response=await fetch(endpoint,{
              method:"POST",signal:AbortSignal.timeout(12000),
              headers:{"content-type":"application/json","apikey":"sb_publishable_CKRScNxEWURNGv4Mz269hg_zdQEmwzS","Authorization":"Bearer definitely.invalid.token"},
              body:JSON.stringify({input:{services:"Teste sintético; não gerar proposta"}})
            });
            console.log(JSON.stringify({test:"ORCA_R5_REJECT_INVALID_JWT",http:response.status,gemini_invoked:false}));
            if(response.status!==401&&response.status!==403)process.exitCode=1;
          })().catch(e=>{console.error("Authorization probe unavailable:",e.name);process.exitCode=1});
          JS
      - name: Protect frozen Financeiro V12 release (code only)
        shell: bash
        run: |
          set -euo pipefail
          frozen='production/dashboard-financeiro-v12-homologada-20261022/index.html'
          expected='1bf77c0fdcf8c715d21170aeb940975f75a1f6fa'
          test -f "$frozen" || { echo 'ERROR: Financeiro V12 homologada missing'; exit 1; }
          actual="$(git hash-object "$frozen")"
          test "$actual" = "$expected" || {
            echo "ERROR: Financeiro V12 frozen blob changed: expected $expected, actual $actual"
            exit 1
          }
          grep -Fq 'V12 · HOMOLOGADA (OPERAÇÃO)' "$frozen"
          grep -Fq 'window.CR_V12_CORA_AUDIT=calculate' "$frozen"
          echo 'Financeiro V12 frozen HTML checked; no financial writes or new services.'
      - name: Prove Financeiro V12 protected close-work, without writes\n        run: node --test audits/finance-v12-close-work-restore.test.cjs\n      - name: Verify homologated HTML is byte-identical
        shell: bash
        run: |
          actual="$(git hash-object production/central-homologada-20261001/index.html)"
          # Hash from owner-confirmed homologation commit a5bc15c3adc297 (2026-10-04).
          # Main file remains byte-identical to that authorized promotion.
          expected="a4d58cf22090e3aa51010720c27978ec476335a5"
          test "$actual" = "$expected" || {
            echo "ERROR: homologated Central baseline was modified."
            echo "Expected $expected, got $actual"
            exit 1
          }
      - name: Reject legacy production routing
        shell: bash
        run: |
          if grep -Eqi 'checkpoint-v270|central-recovery|preview/central-approved-router-candidate-20261001' central-canonical/current/centro-operacoes/index.ts; then
            echo "ERROR: legacy Central reference reintroduced into canonical production router."
            exit 1
          fi
          grep -q 'FORWARD_ONLY_NO_LEGACY_FALLBACK' central-canonical/current/centro-operacoes/index.ts

  protect-visual-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical product design system is unchanged
        shell: bash
        run: |
          actual="$(git hash-object central-runtime/ui/cr-product-design-20260930.css)"
          expected="15826e21af6cddd1e36ecdd85e9d7dce529f0dcb"
          test "$actual" = "$expected" || {
            echo "ERROR: canonical visual identity stylesheet changed without re-homologation."
            echo "Expected $expected, got $actual"
            exit 1
          }
      - name: Require canonical design system in runtime pages
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            case "$file" in
              central-runtime/f01/index.html) continue ;;
            esac
            if ! grep -q 'cr-product-design-20260930.css' "$file"; then
              echo "ERROR: runtime page does not load the canonical design system: $file"
              failed=1
            fi
          done < <(find central-runtime -type f -name '*.html' -print0)
          test "$failed" -eq 0
      - name: Require canonical design system in institutional presentation
        shell: bash
        run: |
          grep -q 'cr-product-design-20260930.css' central/presentation.html || {
            echo "ERROR: institutional presentation bypasses the canonical design system."
            exit 1
          }

  verify-full-central-scope:
    name: Contratos oficiais da Central inteira (links + funcoes)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit all official aliases and embedded business modules
        run: python3 .github/scripts/cr_central_full_scope_audit.py
      - name: Audit Gestor, official rules, preview dependencies and backup workflow catalogue
        run: python3 .github/scripts/cr_ecosystem_contract_audit.py
      - name: Prove Cofre Zero mutable Storage copy retry is fail-closed (offline)
        run: bash .github/scripts/test_cr_cofre_copy_storage_verified.sh
      - name: Enforce F00-F09 official client Edge route contract (offline)
        run: python3 .github/scripts/cr_flow_public_client_perimeter_guard.py
      - name: Exercise isolated WZ-01 authorization deny-by-default contract (synthetic)
        run: |
          node --check security/contracts/wz01-flow-authorization.mjs
          node --test security/contracts/wz01-flow-authorization.test.mjs
      - name: Validate public router regression logic without any network or data
        run: python3 .github/scripts/cr_public_router_liveness_audit.py --self-test
      - name: Probe only public Edge redirect headers; warn on known APP preview
        run: python3 .github/scripts/cr_public_router_liveness_audit.py --probe
