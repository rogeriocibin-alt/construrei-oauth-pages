name: Cofre Zero | Netlify inventory and published offsite
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
  push:
    branches:
      - main
      - checkpoint/cofre-zero-netlify-inventory-offsite-20261011
    paths:
      - .github/workflows/cofre-netlify-inventory-offsite.yml
      - .github/scripts/cofre_netlify_inventory_offsite.py
permissions:
  contents: read
concurrency:
  group: cofre-zero-netlify-inventory-offsite
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      COFRE_OUTPUT_DIR: /tmp/cofre-netlify
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate secrets and runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/cofre_netlify_inventory_offsite.py
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "::error::No existing Netlify token"; exit 2; }
          test -n "$RCLONE_CONFIG_B64" || { echo "::error::No existing Drive authorization"; exit 2; }
          sudo apt-get update -qq && sudo apt-get install -qq -y rclone
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone lsd construrei-drive: >/dev/null
      - name: Inventory and restore-test published files
        run: |
          set -euo pipefail
          python3 .github/scripts/cofre_netlify_inventory_offsite.py
      - name: Preserve seven-site provenance manifest with published-only coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,".github/scripts")
          from cr_netlify_historical_provenance_guard import build
          root=Path(os.environ["COFRE_OUTPUT_DIR"])
          audit=build()
          inventory=json.loads((root/"INVENTORY.json").read_text(encoding="utf-8"))
          assert inventory["inventoried_sites"] == audit["registered_sites"] == 7
          assert inventory["published_static_verified"] == 1 and inventory["without_published_deploy"] == 6
          assert audit["git_related_source_candidate_sites"] == 3
          assert len(audit["no_identical_source_identified_sites"]) == 3
          path=root/"HISTORICAL_PROVENANCE.json"
          path.write_text(json.dumps(audit,ensure_ascii=False,indent=2),encoding="utf-8")
          with (root/"SHA256SUMS.txt").open("a",encoding="utf-8") as f:
              f.write(hashlib.sha256(path.read_bytes()).hexdigest()+"  "+path.name+"\n")
          # Package exactly the three Git source candidates as SOURCES, never
          # as fictitious published Netlify deploy archives.
          # The provenance guard already verifies each source path + SHA256.
          source_zip=root/"HISTORICAL_GIT_SOURCE_CANDIDATES.zip"
          with zipfile.ZipFile(source_zip,"w",compression=zipfile.ZIP_DEFLATED) as output:
              for entry in audit["related_source_candidates"]:
                  for f in entry["files"]:
                      source=pathlib.Path(f["path"])
                      data=source.read_bytes()
                      assert len(data)==f["bytes"] and hashlib.sha256(data).hexdigest()==f["sha256"]
                      assert not source.is_symlink()
                      output.writestr(f["path"],data)
          with (root/"SHA256SUMS.txt").open("a",encoding="utf-8") as f:
              f.write(hashlib.sha256(source_zip.read_bytes()).hexdigest()+"  "+source_zip.name+"\n")
          with zipfile.ZipFile(source_zip) as z:
              assert len(z.namelist())==3 and z.testzip() is None
          print("PASS: Netlify inventory 7, one published static, three Git source candidates archived (NOT deployed), three no identical source")

          PY
      - name: Private offsite snapshot and readback
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(date -u +%Y%m%d-%H%M%S)-$GITHUB_RUN_ID"
          REMOTE="construrei-drive:CONSTRUREI-COFRE-ZERO/24_EXTERNAL_SOURCES/NETLIFY_INVENTORY_AND_PUBLISHED/RUN_$RUN_ID"
          rclone copy "$COFRE_OUTPUT_DIR" "$REMOTE" --immutable
          rclone check "$COFRE_OUTPUT_DIR" "$REMOTE" --one-way
          mkdir -p "$RUNNER_TEMP/netlify-drive-readback"
          rclone copy "$REMOTE" "$RUNNER_TEMP/netlify-drive-readback"
          (cd "$RUNNER_TEMP/netlify-drive-readback" && sha256sum --check SHA256SUMS.txt)
          python3 - <<'PY'
          import os,json,pathlib,zipfile
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"netlify-drive-readback"
          doc=json.loads((p/"INVENTORY.json").read_text())
          assert doc["registered_sites"]==7 and doc["inventoried_sites"]==7
          assert doc["status"]=="PASS_INVENTORY_WITH_PUBLISHED_STATIC"
          provenance=json.loads((p/"HISTORICAL_PROVENANCE.json").read_text(encoding="utf-8"))
          assert provenance["registered_sites"]==7 and provenance["git_related_source_candidate_sites"]==3
          assert doc["published_static_verified"]==1 and doc["without_published_deploy"]==6
          source_pack=p/"HISTORICAL_GIT_SOURCE_CANDIDATES.zip"
          with zipfile.ZipFile(source_pack) as z:
              assert z.testzip() is None
              expected=[f for item in provenance["related_source_candidates"] for f in item["files"]]
              assert len(expected)==3 and sorted(z.namelist())==sorted(f["path"] for f in expected)
              import hashlib
              for f in expected:
                  payload=z.read(f["path"])
                  assert len(payload)==f["bytes"] and hashlib.sha256(payload).hexdigest()==f["sha256"]
          print("PASS: all three historical Git source candidates independently recovered from private Drive; not Netlify deploys")
          for s in doc["sites"]:
              if s["state"]=="STATIC_VERIFIED":
                  with zipfile.ZipFile(p/s["archive"]) as z:
                      assert len(z.namelist())==s["static_files"] and z.testzip() is None
          print("PASS: immutable Drive readback and isolated static restore test")
          PY
          echo "## Cofre Zero — Netlify" >> "$GITHUB_STEP_SUMMARY"
          echo "- Seven project records snapshotted. Published sites backed up and SHA-readback." >> "$GITHUB_STEP_SUMMARY"
          echo "- Unpublished sites are INVENTORIED, not misrepresented as backed up." >> "$GITHUB_STEP_SUMMARY"
          echo "- Does not include Functions, deployment history, DNS or env secrets." >> "$GITHUB_STEP_SUMMARY"
          echo "- Snapshot: NETLIFY_INVENTORY_AND_PUBLISHED/RUN_$RUN_ID" >> "$GITHUB_STEP_SUMMARY"
