name: Cofre Zero | Smart immutable CAS archive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'production/**'
      - 'central-runtime/**'
      - 'gestor-projeto/**'
      - '.github/scripts/**'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cofre-zero-history-full.yml
      - .github/scripts/cr_cofre_direct_cas_fallback.py

permissions:
  contents: read

concurrency:
  group: cofre-zero-history-full
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline CAS tests without data or secrets
        run: |
          python3 -m py_compile .github/scripts/cr_cofre_direct_cas_fallback.py
          python3 .github/scripts/cr_cofre_direct_cas_fallback.py --selftest

  detect:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      primary: ${{ steps.marker.outputs.primary }}
    env:
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
    steps:
      - name: Determine if existing primary snapshot can be archived
        id: marker
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64" || exit 2
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p "$HOME/.config/rclone"
          trap 'rm -f "$HOME/.config/rclone/rclone.conf"' EXIT
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          # Distinguish a missing/unreachable marker from a stale but trusted primary.
          # Fail closed on access errors; never infer a safe fallback from missing credentials.
          if ! rclone cat "construrei-drive:CONSTRUREI-BACKUP-AUTO/CURRENT/BACKUP_STATUS.txt" > "$RUNNER_TEMP/origin.txt"; then
            echo "::error title=Cofre Zero primary probe failed::Cannot read CURRENT/BACKUP_STATUS.txt; check Drive access, remote and Cloud producer. No fallback allowed on unknown primary state."
            exit 21
          fi
          python3 - <<'PY'
          import datetime,os,re
          txt=open(os.environ["RUNNER_TEMP"]+"/origin.txt",encoding="utf-8").read()
          assert txt.startswith("CONSTRU-REI CLOUD BACKUP\n")
          assert "SOURCE_PROJECT: yspuaamokjbrosytqjpg\n" in txt
          assert "DATABASE_FILES: 3\n" in txt
          ident=re.search(r"^RUN_ID: (\d{8}-\d{6})$",txt,re.M)
          assert ident,"Untrusted CURRENT"
          # Change-driven policy: a trusted primary snapshot is enough. Do not
          # require a new snapshot merely because the calendar day changed.
          trusted=bool(ident)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("primary="+("true" if trusted else "false")+"\n")
          print("PRIMARY_STATUS="+("TRUSTED" if trusted else "UNTRUSTED"))
          PY

  archive:
    needs: detect
    if: needs.detect.outputs.primary == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      SOURCE: construrei-drive:CONSTRUREI-BACKUP-AUTO/CURRENT
      ARCHIVE_ROOT: construrei-drive:CONSTRUREI-BACKUP-AUTO/HISTORY_FULL
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Connect to independent private Google Drive
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64" || { echo "::error::Missing RCLONE_CONFIG_B64"; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone lsd construrei-drive: >/dev/null

      - name: Preflight today's Cloud Run snapshot and bounded CAS capacity
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(rclone cat "$SOURCE/BACKUP_STATUS.txt")"
          printf '%s\n' "$STATUS" | grep -Fxq 'CONSTRU-REI CLOUD BACKUP'
          printf '%s\n' "$STATUS" | grep -Fxq 'SOURCE_PROJECT: yspuaamokjbrosytqjpg'
          printf '%s\n' "$STATUS" | grep -Fxq 'DATABASE_FILES: 3'
          RUN_ID="$(printf '%s\n' "$STATUS" | sed -n 's/^RUN_ID: //p' | head -n 1)"
          [[ "$RUN_ID" =~ ^[0-9]{8}-[0-9]{6}$ ]] || exit 3
          [[ "$RUN_ID" == "$(date -u +%Y%m%d)"-* ]] || {
            echo "::error::CURRENT stale: history not updated"; exit 4;
          }
          python3 .github/scripts/cr_history_cas_append.py --dry-run > "$RUNNER_TEMP/cas-preflight.json"
          python3 - <<'PY'
          import json,os
          r=json.load(open(os.environ["RUNNER_TEMP"]+"/cas-preflight.json"))
          assert r["mode"]=="dry-run" and not r["approved_for_cutover"]
          assert r["source_files"]>=4531 and r["drive_free_bytes"]>1073741824
          print("PASS: today's Cloud Run backup and bounded immutable CAS preflight")
          PY
      - name: Commit immutable change-driven CAS delta and verify recovery samples
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/restore-readback"
          python3 .github/scripts/cr_history_cas_append.py --commit --restore-directory "$RUNNER_TEMP/restore-readback" > "$RUNNER_TEMP/cas-report.json"
          python3 - <<'PY'
          import json,os
          p=json.load(open(os.environ["RUNNER_TEMP"]+"/cas-report.json"))
          assert p["snapshot_complete"] and p["append_only"] and p["mode"]=="commit"
          assert p["readback_sql"]==3 and p["readback_storage"]==3
          assert p["source_files"]>=4531
          print("PASS: recoverable CAS delta committed; no new FULL copy")
          print("New CAS objects:",p["new_object_count"])
          print("New unique bytes:",p["estimated_new_object_bytes"])
          print("Manifest SHA256:",p["manifest_sha256"])
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("run_id="+p["run_id"]+"\n")
              out.write("database=3\n")
              out.write("storage="+str(p["source_files"]-5)+"\n")
          PY
      - name: Preflight downloaded SQL files (no replay, no DB access)
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/cr_sql_restore_preflight.py --root "$RUNNER_TEMP/restore-readback" > "$RUNNER_TEMP/sql-restore-preflight.json"
          python3 - <<'PY'
          import json,os
          r=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'sql-restore-preflight.json')))
          assert r["hashes_verified"]==3 and not r["eligible_for_recovery_signoff"]
          print("SQL_PREFLIGHT_PASS: 3/3 files, no database replay")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("- SQL manifest preflight: **3/3 SHA256**, no SQL replay; bootstrap Supabase required: **"+str(r["bootstrap_supabase_required"])+"**.\n")
              f.write("- **SQL RESTORE NOT HOMOLOGATED**: requires isolated PostgreSQL 17/Supabase SQL replay.\n")
          PY
      - name: Check SQL COPY compatibility metadata (no database, no data disclosure)
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/cr_sql_copy_inventory.py --root "$RUNNER_TEMP/restore-readback" > "$RUNNER_TEMP/sql-copy-inventory.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ["RUNNER_TEMP"],"sql-copy-inventory.json")
          result=json.load(open(p, encoding="utf-8"))
          groups=result["copy_headers_by_group"]
          assert result["copy_headers_total"] == sum(groups.values()) and result["copy_headers_total"] > 0
          assert result["row_content_examined"] is False
          assert result["sql_restore_attempted"] is False
          assert result["eligible_for_recovery_signoff"] is False
          summary=("SQL COPY structure: %d blocks (Auth=%d, Storage=%d, others=%d); "
                   "PG17 timeout setting=%s; NOT RESTORED" %
                   (result["copy_headers_total"],groups["auth"],groups["storage"],
                    groups["other"],result["pg17_transaction_timeout_setting"]))
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("- "+summary+"\n")
          PY
      - name: Independently verify every CAS/seed reference without CURRENT
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/cas-report.json"))["run_id"])')"
          python3 .github/scripts/cr_history_cas_append.py --verify-manifest "$RUN_ID" > "$RUNNER_TEMP/cas-independent.json"
          python3 - <<'PY'
          import json,os
          root=os.environ["RUNNER_TEMP"]
          m=json.load(open(root+"/cas-independent.json"))
          r=json.load(open(root+"/cas-report.json"))
          assert m["run_id"]==r["run_id"] and m["manifest_sha256"]==r["manifest_sha256"]
          assert m["verified_entries"]==r["source_files"]
          assert m["independent_of_current"] and not m["database_replay_passed"]
          print("PASS: all historical references independently restored by seed+CAS")
          print("Verified references:",m["verified_entries"])
          PY
      - name: Archive migration ledger in the existing change-driven cycle (private deduplicated CAS)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "::error::Missing managed migration history DB credential"; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates curl gnupg >/dev/null
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt jammy-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          python3 .github/scripts/cr_migration_ledger_change-driven.py --run-id "${{ steps.snapshot.outputs.run_id }}"
      - name: Publish audit result
        if: always()
        shell: bash
        run: |
          {
            echo "## Cofre Zero - immutable CAS change-driven archive"
            echo "- Result: ${{ job.status }}"
            echo "- Run ID: ${{ steps.snapshot.outputs.run_id }}"
            echo "- Database SQL: ${{ steps.snapshot.outputs.database }} / 3"
            echo "- Supabase Storage: ${{ steps.snapshot.outputs.storage }} objects"
            echo "- Target: CONSTRUREI-BACKUP-AUTO/HISTORY_CAS, with immutable HISTORY_FULL seed"
            echo "- Readback: 3 SQL SHA256, 3 Storage samples, full CAS reference validation"
            echo "- This is CAS/file-level recovery, not SQL database replay; FULL seed retained."
            echo "- No modification of CURRENT or production services."
          } >> "$GITHUB_STEP_SUMMARY"

  fallback:
    name: Append only deltas to existing CAS if primary missing
    needs: detect
    if: needs.detect.outputs.primary == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare existing remotes and PG17 (no new infrastructure)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64" && test -n "$SUPABASE_DB_URL" || exit 2
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone curl gnupg ca-certificates >/dev/null
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc |
            gpg --dearmor | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone lsd construrei-drive: >/dev/null
          rclone lsd construrei-s3: >/dev/null
      - name: Bounded same-day CAS delta, never touch CURRENT
        id: incremental
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/cofre-cas-only"
          RUN_ID="$(date -u +%Y%m%d-%H%M%S)"
          trap 'rm -rf "$WORK"; rm -f "$HOME/.config/rclone/rclone.conf"' EXIT
          bash .github/scripts/cr_cofre_fallback_dump.sh "$WORK"
          python3 .github/scripts/cr_cofre_direct_cas_fallback.py --dry-run \
            --work-dir "$WORK" --run-id "$RUN_ID" --max-new-bytes 268435456 > "$WORK/preview.json"
          # SQL must pass structure/hash/COPY gates BEFORE an immutable manifest is committed.
          python3 .github/scripts/cr_sql_restore_preflight.py --root "$WORK" > "$WORK/sql-proof.json"
          python3 .github/scripts/cr_sql_copy_inventory.py --root "$WORK" > "$WORK/sql-copy-proof.json"
          python3 - "$WORK" <<'PY'
          import json,sys,pathlib
          root=pathlib.Path(sys.argv[1])
          sql=json.loads((root/"sql-proof.json").read_text())
          cp=json.loads((root/"sql-copy-proof.json").read_text())
          assert sql["hashes_verified"]==3 and cp["copy_headers_total"]>0
          assert not sql["eligible_for_recovery_signoff"] and not cp["sql_restore_attempted"]
          print("SQL_PREFLIGHT_BEFORE_CAS_COMMIT=PASS")
          PY
          python3 .github/scripts/cr_cofre_direct_cas_fallback.py --commit \
            --work-dir "$WORK" --run-id "$RUN_ID" --max-new-bytes 268435456 > "$WORK/result.json"
          python3 .github/scripts/cr_sql_restore_preflight.py --root "$WORK" > "$WORK/sql-proof.json"
          python3 - "$WORK" <<'PY'
          import json,os,sys,pathlib
          root=pathlib.Path(sys.argv[1])
          result=json.loads((root/"result.json").read_text())
          sql=json.loads((root/"sql-proof.json").read_text())
          assert result["decision"]=="IMMUTABLE_CAS_FALLBACK_COMMITTED"
          assert result["restored_sql_samples"]==3
          assert result["restored_storage_samples"]==3
          assert result["new_unique_bytes"]<=268435456
          assert result["current_untouched"] is True
          assert sql["hashes_verified"]==3
          with open(os.environ["GITHUB_OUTPUT"],"a") as o:
              o.write("run_id="+result["run_id"]+"\n")
          print("CAS_DELTA=PASS; FULL_COPY=NO; SQL_REPLAY=NOT_TESTED")
          print("New immutable content bytes:",result["new_unique_bytes"])
          PY
      - name: Independently prove all manifest references without CURRENT
        env:
          VERIFIED_RUN: ${{ steps.incremental.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/cr_history_cas_append.py --verify-manifest "$VERIFIED_RUN" |
            python3 -c 'import json,sys;r=json.load(sys.stdin);assert r["verified_entries"]>=4531 and r["independent_of_current"];print("CAS_REFERENCE_PROOF=PASS")'
      - name: Summarize unique-content backup
        if: always()
        shell: bash
        run: |
          echo "## Cofre Zero — CAS delta fallback" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "No new cron/Cloud service/full Storage copy; no CURRENT write" >> "$GITHUB_STEP_SUMMARY"

