name: Build CONSTRU-REI Central renderer once
on:
  push:
    paths:
      - '.github/workflows/build-central-renderer-once.yml'

permissions:
  contents: write

jobs:
  build-central:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch, patch and validate Central
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p central
          curl --fail --silent --show-error --location 'https://grove-rush-stone.pagey.site/' -o central/source.html
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('central/source.html')
          raw=p.read_bytes()
          src=raw.decode('utf-8')
          old='https://arrow-crown-blackbird.pagey.site/'
          new='https://cotton-blossom-quill.pagey.site/'
          assert src.count(old)==1, f'oldCount={src.count(old)}'
          required=['Central Única F00','Digite sua chave','central-gestao-api','F00','F09','Dashboard Gerencial V4']
          for mark in required:
              assert mark in src, f'missing:{mark}'
          out=src.replace(old,new)
          assert old not in out
          assert out.count(new)==1
          Path('central/index.html').write_text(out,encoding='utf-8',newline='')
          print('SOURCE_SHA256='+hashlib.sha256(raw).hexdigest())
          print('PUBLISHED_SHA256='+hashlib.sha256(out.encode('utf-8')).hexdigest())
          print('CHARS='+str(len(out)))
          print('OLD_COUNT='+str(out.count(old)))
          print('NEW_COUNT='+str(out.count(new)))
          PY
          rm central/source.html

      - name: Commit renderer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CR Assertivo Cloud'
          git config user.email 'actions@users.noreply.github.com'
          git add central/index.html
          git commit -m 'feat: publish canonical Central renderer' || true
          git push origin HEAD:main

      - name: Verify published GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          URL='https://rogeriocibin-alt.github.io/construrei-oauth-pages/central/'
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -L -sS -o /tmp/central-live.html -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ] && grep -q 'cotton-blossom-quill.pagey.site' /tmp/central-live.html && ! grep -q 'arrow-crown-blackbird.pagey.site' /tmp/central-live.html; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = "1"
          ctype=$(curl -L -sSI "$URL" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2; exit}')
          echo "LIVE_URL=$URL"
          echo "HTTP=200"
          echo "CTYPE=$ctype"
          grep -q 'text/html' <<<"$ctype"
          grep -q 'Central Única F00' /tmp/central-live.html
          grep -q 'Digite sua chave' /tmp/central-live.html
          grep -q 'central-gestao-api' /tmp/central-live.html
          grep -q 'F09' /tmp/central-live.html
          grep -q 'Dashboard Gerencial V4' /tmp/central-live.html
          echo 'CR_CENTRAL_GITHUB_PAGES_GATE=PASS'
