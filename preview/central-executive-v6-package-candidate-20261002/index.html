<script>
(async()=>{
  try{
    const baseUrl='../central-executive-v5-static-candidate-20261002/index.html?base='+Date.now();
    const r=await fetch(baseUrl,{cache:'no-store'});
    if(!r.ok)throw new Error('Falha ao carregar base V5: HTTP '+r.status);
    let h=await r.text();
    h=h.replace('<head>','<head><base href="../central-executive-v5-static-candidate-20261002/">');
    h=h.replace('</head>','<meta name="cr-v6-package" content="CR-EXECUTIVE-V6-FULL-PACKAGE-20261002-R3"></head>');

    document.open();document.write(h);document.close();
  }catch(e){
    document.getElementById('card').innerHTML='<b>Não foi possível abrir a candidata.</b><small>'+String(e.message||e)+'</small>';
  }
})();
</script>
</body>
