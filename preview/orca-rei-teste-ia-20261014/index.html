<!doctype html><html lang="pt-BR"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>ORÇA-REI — Teste</title><style>body{font:16px system-ui;background:#edf2fa;color:#123;max-width:800px;margin:auto;padding:20px}header{background:#07185d;color:white;padding:20px;border-radius:14px}textarea,select{box-sizing:border-box;width:100%;padding:12px;font:inherit;border-radius:9px;margin:8px 0;border:1px solid #aaa}textarea{min-height:210px}button{background:#1754b4;color:white;padding:13px 16px;border:0;border-radius:10px;cursor:pointer;margin:7px 5px 7px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:15px;border-radius:12px}.alert{background:#fffae8;padding:12px;border-radius:9px}</style><header><h1>ORÇA-REI | Teste F02</h1>CONSTRU-REI • candidata isolada • sem login</header><p class="alert" id="status">Verificando IA...</p><label>Documento<select id="mode"><option value="budget">Orçamento</option><option value="report">Parecer técnico sem valores</option></select></label><label>Agente para testar<select id="provider"><option value="auto">Automático (Groq → Gemini)</option><option value="gemini">Somente Gemini</option><option value="groq">Somente Groq 120B</option></select></label><label>Texto de teste<textarea id="src">SERVIÇOS:\nVedação de janela (Selar juntas e pontos de infiltração)\nLimpeza de calha (Retirar resíduos e desobstruir descidas)\nMATERIAIS:\nSelante flexível\nOBSERVAÇÕES:\nConfirmar medidas no local.</textarea></label><button onclick="send('format')">Testar formatação</button><button id="ai" onclick="send('ai')">Gerar com IA real</button><h3>Resultado</h3><b id="label"></b><pre id="out"></pre><button onclick="navigator.clipboard.writeText(document.getElementById('out').textContent)">Copiar</button><script>const endpoint='https://yspuaamokjbrosytqjpg.supabase.co/functions/v1/cr-orca-rei-test-bench-20261014';async function send(action){document.getElementById('label').textContent='Processando...';try{let r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,source:document.getElementById('src').value,mode:document.getElementById('mode').value,provider:document.getElementById('provider').value})});let d=await r.json();document.getElementById('label').textContent=d.ok?'Resposta real: '+d.provider:d.error?'Requisição bloqueada antes da IA':'Formatação local (sem IA)';document.getElementById('out').textContent=d.output||(d.error==='cooldown'||d.error==='Limite de consumo: cooldown'?'Aguarde 60 segundos desde a última tentativa e clique novamente em Gerar com IA real. Nenhuma geração foi concluída nesta tentativa.':d.error)||'Sem resultado'}catch(e){document.getElementById('out').textContent=String(e)}}fetch(endpoint+'?status=1').then(r=>r.json()).then(x=>{document.getElementById('ai').disabled=!x.model_available;document.getElementById('status').textContent=x.model_available?'Groq 120B • Gemini '+(x.gemini_configured?'com chave detectada':'sem chave detectada')+' • Teto interno 1000/dia (cotas reais dependem dos provedores)':'A formatação pode ser testada; IA real exige chave Groq no backend.'})</script></html>
