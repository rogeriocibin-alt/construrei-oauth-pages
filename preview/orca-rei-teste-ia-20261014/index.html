<!doctype html><html lang="pt-BR"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>ORÇA-REI — Teste</title><style>body{font:16px system-ui;background:#edf2fa;color:#123;max-width:800px;margin:auto;padding:20px}header{background:#07185d;color:white;padding:20px;border-radius:14px}textarea,select{box-sizing:border-box;width:100%;padding:12px;font:inherit;border-radius:9px;margin:8px 0;border:1px solid #aaa}textarea{min-height:210px}button{background:#1754b4;color:white;padding:13px 16px;border:0;border-radius:10px;cursor:pointer;margin:7px 5px 7px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:15px;border-radius:12px}.alert{background:#fffae8;padding:12px;border-radius:9px} #pdfmeta input{box-sizing:border-box;width:100%;padding:8px;border:1px solid #aebdcc;border-radius:7px;display:block;margin:5px 0 10px}#pdfmeta label{font-size:12px;font-weight:600}@media(max-width:550px){#pdfmeta{grid-template-columns:1fr!important}}</style><header><h1>ORÇA-REI | Teste F02</h1>CONSTRU-REI • candidata isolada • sem login</header><p class="alert" id="status">Verificando IA...</p><label>Documento<select id="mode"><option value="budget">Orçamento</option><option value="report">Parecer técnico sem valores</option></select></label><label>Agente para testar<select id="provider"><option value="auto">Automático (Groq → Gemini)</option><option value="gemini">Somente Gemini</option><option value="groq">Somente Groq 120B</option></select></label><label>Texto de teste<textarea id="src">SERVIÇOS:\nVedação de janela (Selar juntas e pontos de infiltração)\nLimpeza de calha (Retirar resíduos e desobstruir descidas)\nMATERIAIS:\nSelante flexível\nOBSERVAÇÕES:\nConfirmar medidas no local.</textarea></label><button onclick="send('format')">Testar formatação</button><button id="ai" onclick="send('ai')">Gerar com IA real</button><div id="pdfmeta" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><label>Nº documento<input id="pdfnumber" placeholder="Ex.: 710-26"></label><label>Cliente<input id="pdfclient" placeholder="Cliente / origem"></label><label>Endereço<input id="pdfaddress" placeholder="Endereço da obra"></label><label>Responsável<input id="pdfperson" value="CONSTRU-REI"></label><label>Assunto<input id="pdftitle" placeholder="Vistoria / serviço"></label><label>Fotos<input id="pdffiles" type="file" accept="image/*" multiple></label></div><h3>Resultado</h3><b id="label"></b><pre id="out"></pre><button onclick="navigator.clipboard.writeText(document.getElementById('out').textContent)">Copiar</button><button onclick="exportPdf()" style="background:#d4a51c;color:#092b47;font-weight:bold">Gerar PDF institucional</button><small>Revise o texto; no diálogo selecione Salvar como PDF e ative gráficos de fundo.</small><script>const endpoint='https://yspuaamokjbrosytqjpg.supabase.co/functions/v1/cr-orca-rei-test-bench-20261014';async function send(action){document.getElementById('label').textContent='Processando...';try{let r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,source:document.getElementById('src').value,mode:document.getElementById('mode').value,provider:document.getElementById('provider').value})});let d=await r.json();document.getElementById('label').textContent=d.ok?'Resposta real: '+d.provider:d.error?'Requisição bloqueada antes da IA':'Formatação local (sem IA)';document.getElementById('out').textContent=d.output||(d.error==='cooldown'||d.error==='Limite de consumo: cooldown'?'Aguarde 60 segundos desde a última tentativa e clique novamente em Gerar com IA real. Nenhuma geração foi concluída nesta tentativa.':d.error)||'Sem resultado'}catch(e){document.getElementById('out').textContent=String(e)}}fetch(endpoint+'?status=1').then(r=>r.json()).then(x=>{document.getElementById('ai').disabled=!x.model_available;document.getElementById('status').textContent=x.model_available?'Groq 120B • Gemini '+(x.gemini_configured?'com chave detectada':'sem chave detectada')+' • Teto interno 1000/dia (cotas reais dependem dos provedores)':'A formatação pode ser testada; IA real exige chave Groq no backend.'})
function pdfEsc(x){return String(x||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pdfVal(id){return(document.getElementById(id).value||'').trim()}
async function exportPdf(){
var txt=document.getElementById('out').textContent||'';
if(txt.length<30||txt.indexOf('Provedores indisponíveis')===0){alert('Gere primeiro um orçamento ou parecer válido.');return}
var isReport=document.getElementById('mode').value==='report';
var title=isReport?'PARECER TÉCNICO':'ORÇAMENTO';
var num=pdfVal('pdfnumber')||'A DEFINIR';
var fields=[['CLIENTE / ORIGEM',pdfVal('pdfclient')||'Não informado'],['ENDEREÇO',pdfVal('pdfaddress')||'Não informado'],['DATA',new Date().toLocaleDateString('pt-BR')],['RESPONSÁVEL',pdfVal('pdfperson')||'CONSTRU-REI']];
var raw=txt.replace(/\r/g,'').split('\n').map(function(x){return x.trim()}).filter(Boolean);
var sections=[],cur=null;
var headings=/^(SITUAÇÃO RELATADA|OBJETIVO E ESCOPO.*|VERIFICAÇÕES REALIZADAS|ANÁLISE TÉCNICA.*|HIPÓTESE TÉCNICA|RECOMENDAÇÕES.*|INFORMAÇÕES A CONFIRMAR|CONSIDERAÇÕES DE SEGURANÇA|CONCLUSÃO|SERVIÇOS.*|MATERIAIS|RESUMO|OBSERVAÇÕES TÉCNICAS|OBSERVAÇÕES)\s*:?\s*$/i;
raw.forEach(function(line){if(headings.test(line)){cur={heading:line,text:[]};sections.push(cur)}else{if(!cur){cur={heading:isReport?'OBJETIVO E ESCOPO':'DESCRIÇÃO',text:[]};sections.push(cur)}cur.text.push(line)}});
var body=sections.map(function(s,i){return '<section><h2>'+(i+1)+'. '+pdfEsc(s.heading)+'</h2>'+s.text.map(function(t){var cls=/^TOTAL|^QTD\./.test(t)?'money':/^\d+\.\s+[A-ZÁ-Ú]/.test(t)?'service':'';return '<p class="'+cls+'">'+pdfEsc(t)+'</p>'}).join('')+'</section>'}).join('');
var files=Array.from(document.getElementById('pdffiles').files||[]).slice(0,12);
var images=await Promise.all(files.map(function(f){return new Promise(function(resolve){var rd=new FileReader();rd.onload=function(){resolve({src:rd.result,name:f.name})};rd.onerror=function(){resolve(null)};rd.readAsDataURL(f)})}));
images=images.filter(Boolean);
if(images.length){body+='<section><h2>'+(sections.length+1)+'. REGISTROS FOTOGRÁFICOS</h2><div class="photos">'+images.map(function(p,i){return '<figure><img src="'+p.src+'"><figcaption>'+(i+1)+'. '+pdfEsc(p.name)+'</figcaption></figure>'}).join('')+'</div><p class="note">Fotografias anexadas para conferência. Confirmar legendas e correspondência com a vistoria.</p></section>'}
var cs='@page{size:A4;margin:28mm 13mm 21mm}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;font-size:10px;color:#17344b;margin:0}header{position:relative;margin:-28mm -13mm 10mm;display:flex;border-top:4px solid #ddb327;height:26mm}header .logo{width:30%;display:flex;justify-content:center;align-items:center;font-size:20px;color:#073b64;font-weight:bold}header .blue{width:70%;background:#07385f;color:white;padding:10px 16px}header h1{font-size:19px;margin:0}header b{color:#d5ae27;font-size:15px}header small{display:block;margin-top:5px}.info{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:15px}.info div{background:#eff6fa;border:1px solid #cedde7;border-radius:4px;padding:8px;overflow-wrap:anywhere}.info strong{color:#08527a;display:block;font-size:8px;margin-bottom:5px}h2{color:white;background:#073d68;padding:6px 10px;font-size:11px;border-radius:3px;margin:16px 0 8px}p{font-size:10.5px;line-height:1.45;margin:5px 8px;white-space:pre-wrap;overflow-wrap:anywhere}p.service{font-weight:bold;color:#0a3b64}p.money{background:#f0f6fa;padding:6px;font-weight:700}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photos figure{border:1px solid #d0dfe9;background:#f3f8fb;padding:5px;margin:0;break-inside:avoid}.photos img{width:100%;height:95px;object-fit:cover}.photos figcaption{font-size:9px;margin-top:4px}.note{font-size:9px;color:#567}.footer{position:fixed;bottom:-21mm;left:-13mm;right:-13mm;background:linear-gradient(to right,#07385f 78%,#d8ab1a 78%);height:14mm;display:flex;align-items:center;justify-content:space-around;color:white;font-size:8px}.footer strong{color:#07385f}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.noprint{display:none}}';
var meta='<div class="info">'+fields.map(function(p){return '<div><strong>'+pdfEsc(p[0])+'</strong>'+pdfEsc(p[1])+'</div>'}).join('')+'</div>';
var html='<html lang="pt-BR"><head><meta charset="utf-8"><title>'+pdfEsc(title+' '+num)+'</title><style>'+cs+'</style></head><body><div class="noprint">Use Ctrl+P e escolha Salvar como PDF. <button onclick="window.print()">Imprimir PDF</button></div><header><div class="logo">CONSTRU-REI</div><div class="blue"><h1>'+title+'</h1><b>Nº '+pdfEsc(num)+'</b><small>'+pdfEsc(pdfVal('pdftitle')||'MANUTENÇÃO • REFORMAS • DIAGNÓSTICO')+'</small></div></header>'+meta+body+'<div class="footer"><span>(41) 98778-6277</span><span>construrei@construrei.com.br</span><span>Curitiba/PR • Região Metropolitana</span><strong>CONSTRU-REI</strong></div></body></html>';
var win=window.open('','_blank');if(!win){alert('Permita pop-ups para abrir o PDF.');return}win.document.open();win.document.write(html);win.document.close();win.focus();win.print();
}
</script></html>
