<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homologação F00→F09</title><link rel="stylesheet" href="./product-alignment.css?v=20261005"><style>
body{margin:0}.w{max-width:1100px;margin:auto;padding:16px}.homHero{background:radial-gradient(circle at 84% 25%,rgba(37,144,255,.26),transparent 28%),linear-gradient(118deg,#031b46,#052d70 62%,#06245a);color:#fff;border:1px solid rgba(255,196,0,.34);border-radius:16px;padding:18px;box-shadow:0 16px 42px rgba(6,40,86,.14)}.homHero h1{color:#fff;margin:0 0 5px}.homHero p{color:#dceaff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row{background:#fff;border:1px solid #d3e4f1;border-radius:14px;padding:14px;margin:10px 0;display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(15,61,105,.08)}.phase{font-size:20px;font-weight:900;color:#07175b}.mut{color:#637d98}.state{font-weight:900;color:#075bd8;margin-bottom:4px}.actions{display:flex;gap:6px;flex-wrap:wrap}.btn{border:1px solid #b8d5ea;border-radius:10px;padding:10px 12px;font-weight:800;text-decoration:none;cursor:pointer}.open{background:#fff;color:#075bd8}.pass{background:#0daf67;color:#fff;border-color:#0daf67}.fail{background:#ee2147;color:#fff;border-color:#ee2147}.report{background:#075bd8;color:#fff;border-color:#075bd8}textarea{width:100%;box-sizing:border-box;background:#fff;color:#17315d;border:1px solid #b8d5ea;border-radius:9px;padding:8px;margin-top:8px}.summary{display:none;background:#fff;border:1px solid #d3e4f1;border-radius:14px;padding:16px;margin:12px 0}.summary.show{display:block}.summary pre{white-space:pre-wrap;color:#17315d;background:#f7fbfe;border:1px solid #d3e4f1;padding:12px;border-radius:10px}@media(max-width:700px){.row{grid-template-columns:50px 1fr}.actions{grid-column:1/-1}.phase{font-size:17px}}
</style></head><body><main class="w"><section class="homHero"><div style="font-size:11px;color:#ffd33c;font-weight:900">CONSTRU-REI • APP CANDIDATO</div><h1>Homologação F00 → F09</h1><p>Validação objetiva do corredor operacional. Aprovar aqui não promove produção.</p><div class="toolbar"><button class="btn report" onclick="resumo()">GERAR RESUMO</button><button class="btn open" onclick="copiar()">COPIAR RESUMO</button></div></section><section id="summary" class="summary"><h2>Resumo da homologação</h2><pre id="summaryText"></pre></section><div id="rows"></div></main><script>
const tests={
F00:["Abrir/capturar chamado","Anexar evidência","Liberar para F01"],
F01:["Abrir caso recebido","Confirmar dados sem redigitação","Marcar PRONTO F02 / handoff"],
F02:["Receber Caso 360","Editar orçamento e snapshot","Liberar F03 sem duplicar"],
F03:["Consumir orçamento","Registrar proposta/OS","Aprovar e avançar F04 uma única vez"],
F04:["Programar execução","Confirmar responsável/prestador","Verificar Agenda Core"],
F05:["Registrar materiais/prestador","Controlar uso/sobra/devolução","Avançar sem perder contexto"],
F06:["Executar tarefas","Registrar evidências/aceite","Concluir execução"],
F07:["Classificar ocorrência","Registrar ação/reinspeção","Separar retrabalho/garantia/novo escopo"],
F08:["Conferir financeiro/documentos","Validar fechamento sem reabrir liquidado","Preparar NF"],
F09:["Registrar aceite/relatório","Classificar pós-obra","Encerrar jornada"]
}; const key="cr_homologacao_checklist_native_20261004",S=JSON.parse(localStorage.getItem(key)||"{}");
function save(){localStorage.setItem(key,JSON.stringify(S));render()}
function setS(f,s){S[f]=S[f]||{};S[f].status=s;S[f].at=new Date().toISOString();save()}
function note(f,v){S[f]=S[f]||{};S[f].note=v;localStorage.setItem(key,JSON.stringify(S))}
function render(){rows.innerHTML=Object.entries(tests).map(([f,t])=>'<section class="row"><div class="phase">'+f+'</div><div><div class="state">'+(S[f]?.status||"NÃO TESTADO")+'</div><div class="mut">'+t.map((x,i)=>(i+1)+". "+x).join(" • ")+'</div><textarea placeholder="Observação / gap encontrado" oninput="note(\''+f+'\',this.value)">'+(S[f]?.note||"")+'</textarea></div><div class="actions"><a class="btn open" href="./'+f.toLowerCase()+'/" target="_blank">ABRIR</a><button class="btn pass" onclick="setS(\''+f+'\',\'APROVADO LOCAL\')">PASSAR</button><button class="btn fail" onclick="setS(\''+f+'\',\'REPROVADO\')">REPROVAR</button></div></section>').join("")}
function reportText(){const lines=["CONSTRU-REI • HOMOLOGAÇÃO F00→F09","Candidata: checklist-native-20261004","Data: "+new Date().toLocaleString("pt-BR"),""];Object.keys(tests).forEach(f=>{const x=S[f]||{};lines.push(f+" — "+(x.status||"NÃO TESTADO")+(x.note?" • "+x.note:""))});return lines.join("\n")} function resumo(){summaryText.textContent=reportText();summary.classList.add("show");summary.scrollIntoView({behavior:"smooth"})} async function copiar(){const t=reportText();try{await navigator.clipboard.writeText(t);alert("Resumo copiado.")}catch{summaryText.textContent=t;summary.classList.add("show")}} render();</script></body></html>
