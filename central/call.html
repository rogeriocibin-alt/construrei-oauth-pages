<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04101f">
<title>CONSTRU-REI • Central Call</title>
<style>
:root{--n:#04101f;--b:#0b4f91;--g:#d6a51b;--line:#244a68;--ok:#49d391;--bad:#ff6b78}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 85% -10%,#124a76,#06182b 45%,#03101c);color:#fff;font:14px Inter,system-ui,Segoe UI,Arial;min-height:100vh;padding:14px}
.room{max-width:1100px;margin:auto}.head{display:flex;gap:10px;align-items:center;margin-bottom:12px}.head h1{margin:0;font-size:22px}.status{margin-left:auto;border:1px solid #315c7b;border-radius:999px;padding:6px 10px;color:#c7d9e7}.status.live{color:#aef0cc;border-color:#24704e}.status.bad{color:#ffd1d5;border-color:#7b2731}
.stage{background:linear-gradient(180deg,#082d53,#061d36);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 20px 60px #0005}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;min-height:55vh;align-content:center}.tile{position:relative;background:#010b13;border:1px solid #284d69;border-radius:16px;overflow:hidden;aspect-ratio:16/10;min-height:190px}.tile video{width:100%;height:100%;object-fit:cover}.label{position:absolute;left:9px;bottom:9px;background:#06192acc;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800}.dot{position:absolute;right:9px;top:9px;width:9px;height:9px;border-radius:50%;background:#d8a91f}.dot.ok{background:var(--ok)}
.actions{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #345b78;background:#0a3c6d;color:#fff;border-radius:12px;padding:10px 12px;font-weight:850}.btn.gold{background:linear-gradient(90deg,#bd8b11,#e4be4c);color:#211500;border-color:#e9ca72}.btn.bad{background:#7b2731}.btn:disabled{opacity:.45}
.note{text-align:center;color:#9fb4c6;font-size:11px;margin-top:10px}.fallback{margin-top:12px;border:1px solid #725d28;background:#2d281b;border-radius:13px;padding:10px;color:#e9d9a7;text-align:center}.diag{margin-top:10px;border:1px solid #294f6c;border-radius:12px;padding:10px;background:#061a2e;color:#bfd0dd;font-size:11px}.diag b{color:#fff}.perm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}.perm div{border:1px solid #315873;border-radius:10px;padding:8px;background:#071d31}.oktxt{color:#aef0cc}.badtxt{color:#ffb6bd}
@media(max-width:650px){body{padding:8px}.grid{grid-template-columns:1fr;min-height:62vh}.tile{min-height:210px}.head{align-items:flex-start}.head h1{font-size:18px}.status{font-size:11px;max-width:46%;text-align:center}.perm{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="room">
<div class="head"><div><small>CENTRAL CALL • INTERNA</small><h1>Sala Principal CONSTRU-REI</h1></div><div id="st" class="status">Pronto para entrar</div></div>
<section class="stage">
<div id="grid" class="grid"><div class="tile" id="local"><video id="lv" autoplay muted playsinline></video><span class="label">Você</span><i class="dot ok"></i></div></div>
<div class="perm"><div>Microfone: <b id="pMic">não solicitado</b></div><div>Câmera: <b id="pCam">não solicitada</b></div></div>
<div class="actions">
<button id="join" class="btn gold">🎥 Entrar</button>
<button id="mic" class="btn" disabled>🎙️ Microfone</button>
<button id="cam" class="btn" disabled>📷 Câmera</button>
<button id="share" class="btn" disabled>🖥️ Compartilhar</button>
<button id="leave" class="btn bad" disabled>Encerrar</button>
</div>
<div class="note">As permissões são pedidas somente após tocar em Entrar, uma por vez.</div>
<div id="diag" class="diag"></div>
</section>
<div class="fallback">Google Meet fica apenas como contingência. <button id="fb" class="btn">Abrir Meet de contingência</button></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
const U="https://yspuaamokjbrosytqjpg.supabase.co";
const K="sb_publishable_CKRScNxEWURNGv4Mz269hg_zdQEmwzS";
const MEET="https://meet.google.com/xtw-rihq-jwi";
const S=window.supabase.createClient(U,K,{auth:{persistSession:false}});
const ROOM='central-call-main-v3';
const ID=crypto.randomUUID();
const CFG={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
let ch=null,ls=null,ss=null,joined=false;
const peers=new Map(),queues=new Map(),q=s=>document.querySelector(s);
function status(t,kind=''){q('#st').textContent=t;q('#st').className='status'+(kind?' '+kind:'')}
function setPerm(id,text,ok){const el=q(id);el.textContent=text;el.className=ok===true?'oktxt':ok===false?'badtxt':''}
function buttons(on){['#mic','#cam','#share','#leave'].forEach(x=>q(x).disabled=!on);q('#join').disabled=on}
function diag(){q('#diag').innerHTML='<b>Contexto seguro:</b> '+(window.isSecureContext?'SIM':'NÃO')+' • <b>MediaDevices:</b> '+(navigator.mediaDevices?'SIM':'NÃO')+' • <b>Origem:</b> '+location.origin}
diag();
async function permissionState(name){try{if(!navigator.permissions||!navigator.permissions.query)return 'indisponível';const r=await navigator.permissions.query({name});return r.state}catch{return 'indisponível'}}
async function requestAudio(){
 setPerm('#pMic','solicitando…');
 const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});
 setPerm('#pMic','autorizado',true);return s.getAudioTracks()[0]||null;
}
async function requestVideo(){
 setPerm('#pCam','solicitando…');
 const s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user'}});
 setPerm('#pCam','autorizada',true);return s.getVideoTracks()[0]||null;
}
function errLabel(e){const n=e&&e.name||''; if(n==='NotAllowedError')return 'permissão bloqueada/negada pelo navegador ou sistema'; if(n==='NotFoundError')return 'dispositivo não encontrado'; if(n==='NotReadableError')return 'câmera/microfone em uso por outro app'; if(n==='SecurityError')return 'bloqueio de segurança do navegador'; return (e&&e.message)||n||'erro desconhecido'}
function send(kind,data={}){return ch?ch.send({type:'broadcast',event:'rtc',payload:{kind,from:ID,name:'Participante',...data}}):Promise.resolve()}
function tile(id,name){let t=document.getElementById('p-'+id);if(t)return t;t=document.createElement('div');t.id='p-'+id;t.className='tile';t.innerHTML='<video autoplay playsinline></video><span class="label"></span><i class="dot"></i>';t.querySelector('.label').textContent=name||'Participante';q('#grid').appendChild(t);return t}
function rm(id){let p=peers.get(id);if(p){try{p.close()}catch{}peers.delete(id)}document.getElementById('p-'+id)?.remove();queues.delete(id)}
function queue(id,c){if(!queues.has(id))queues.set(id,[]);queues.get(id).push(c)}
async function flush(id,pc){for(const c of queues.get(id)||[]){try{await pc.addIceCandidate(c)}catch{}}queues.delete(id)}
function peer(id,name){let pc=peers.get(id);if(pc)return pc;pc=new RTCPeerConnection(CFG);peers.set(id,pc);if(ls)ls.getTracks().forEach(t=>pc.addTrack(t,ls));pc.onicecandidate=e=>{if(e.candidate)send('candidate',{to:id,candidate:e.candidate.toJSON?e.candidate.toJSON():e.candidate})};pc.ontrack=e=>{let t=tile(id,name),v=t.querySelector('video');if(v.srcObject!==e.streams[0])v.srcObject=e.streams[0]};pc.onconnectionstatechange=()=>{let t=tile(id,name),d=t.querySelector('.dot'),s=pc.connectionState;d.classList.toggle('ok',s==='connected');if(['failed','closed'].includes(s))rm(id)};return pc}
async function offer(id,name){let pc=peer(id,name);if(pc.signalingState!=='stable')return;let o=await pc.createOffer();await pc.setLocalDescription(o);await send('offer',{to:id,sdp:pc.localDescription})}
async function handle(p){if(!p||p.from===ID||(p.to&&p.to!==ID))return;let id=p.from,n=p.name||'Participante';try{if(p.kind==='hello'){await send('welcome',{to:id});if(ID<id)await offer(id,n)}else if(p.kind==='welcome'){if(ID<id)await offer(id,n)}else if(p.kind==='offer'){let pc=peer(id,n);await pc.setRemoteDescription(p.sdp);await flush(id,pc);let a=await pc.createAnswer();await pc.setLocalDescription(a);await send('answer',{to:id,sdp:pc.localDescription})}else if(p.kind==='answer'){let pc=peer(id,n);await pc.setRemoteDescription(p.sdp);await flush(id,pc)}else if(p.kind==='candidate'){let pc=peer(id,n);if(pc.remoteDescription)await pc.addIceCandidate(p.candidate);else queue(id,p.candidate)}else if(p.kind==='leave')rm(id)}catch(e){console.warn(e)}}
async function start(){
 if(joined)return;
 if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status('Navegador incompatível ou contexto inseguro','bad');return}
 q('#join').disabled=true; status('Solicitando microfone…');
 let audio=null,video=null;
 try{audio=await requestAudio()}catch(e){setPerm('#pMic',errLabel(e),false);status('Microfone bloqueado pelo sistema','bad');q('#join').disabled=false;return}
 status('Solicitando câmera…');
 try{video=await requestVideo()}catch(e){setPerm('#pCam',errLabel(e),false);status('Câmera bloqueada; entrando só com áudio','bad')}
 ls=new MediaStream(); if(audio)ls.addTrack(audio); if(video)ls.addTrack(video); q('#lv').srcObject=ls;
 ch=S.channel(ROOM,{config:{broadcast:{self:false},presence:{key:ID}}}).on('broadcast',{event:'rtc'},({payload})=>handle(payload)).on('presence',{event:'sync'},()=>status('Ao vivo • '+Object.keys(ch.presenceState()).length+' participante(s)','live')).subscribe(async s=>{if(s==='SUBSCRIBED'){joined=true;buttons(true);status('Ao vivo • conectando equipe','live');await ch.track({joined_at:new Date().toISOString()});await send('hello')}});
}
async function end(){try{await send('leave')}catch{}for(const id of [...peers.keys()])rm(id);if(ch){try{await ch.untrack()}catch{}try{await S.removeChannel(ch)}catch{}ch=null}ss?.getTracks().forEach(t=>t.stop());ls?.getTracks().forEach(t=>t.stop());ss=ls=null;q('#lv').srcObject=null;joined=false;buttons(false);setPerm('#pMic','não solicitado');setPerm('#pCam','não solicitada');status('Reunião encerrada')}
q('#join').addEventListener('click',start,{passive:true});
q('#leave').onclick=end;
q('#mic').onclick=()=>{let t=ls?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;q('#mic').textContent=t.enabled?'🎙️ Microfone':'🔇 Sem áudio'}};
q('#cam').onclick=()=>{let t=ls?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;q('#cam').textContent=t.enabled?'📷 Câmera':'🚫 Sem vídeo'}};
q('#share').onclick=async()=>{if(!ls||!navigator.mediaDevices.getDisplayMedia)return;try{ss=await navigator.mediaDevices.getDisplayMedia({video:true});let st=ss.getVideoTracks()[0];for(const pc of peers.values()){let s=pc.getSenders().find(x=>x.track&&x.track.kind==='video');if(s)await s.replaceTrack(st)}q('#lv').srcObject=ss;st.onended=async()=>{let cam=ls?.getVideoTracks()[0];for(const pc of peers.values()){let s=pc.getSenders().find(x=>x.track&&x.track.kind==='video');if(s&&cam)await s.replaceTrack(cam)}q('#lv').srcObject=ls;ss=null}}catch{}};
q('#fb').onclick=()=>window.open(MEET,'_blank','noopener');
window.addEventListener('beforeunload',()=>{if(joined)send('leave')});
Promise.all([permissionState('microphone'),permissionState('camera')]).then(([m,c])=>{if(m!=='indisponível')setPerm('#pMic',m==='granted'?'já autorizado':m,m==='granted'?true:m==='denied'?false:undefined);if(c!=='indisponível')setPerm('#pCam',c==='granted'?'já autorizada':c,c==='granted'?true:c==='denied'?false:undefined)});
})();
</script>
</body>
</html>
