<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CONSTRU-REI | Dashboard Gerencial</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#07182b;color:#fff;padding:20px}
main{max-width:620px;width:100%;text-align:center;background:#12395d;border:1px solid #355779;padding:30px;border-radius:18px;box-shadow:0 8px 30px #0005}h1{font-size:22px}p{line-height:1.5;color:#e9eef2}button{background:#c9a14a;color:#08182b;border:0;border-radius:9px;padding:12px 20px;font-weight:bold;cursor:pointer}
small{display:block;margin-top:16px;color:#cbd5e1}
</style>
</head>
<body>
<main id="bootstrap">
<h1>CONSTRU-REI · Dashboard Gerencial</h1>
<p id="status">Carregando a versão atual do Dashboard com autenticação e corte financeiro...</p>
<button id="retry" hidden type="button">Tentar novamente</button>
<small>Os acertos e o Capital de Giro são processados somente após autenticação e confirmação.</small>
</main>
<script>
(function(){
"use strict";
const APP="https://yspuaamokjbrosytqjpg.supabase.co/functions/v1/cr-dashboard-gerencial-v4-renderfix-ui-candidate";
const status=document.getElementById("status"),retry=document.getElementById("retry");
async function load(){
 retry.hidden=true;
 status.textContent="Carregando a interface oficial...";
 try{
  const response=await fetch(APP+"?bootstrap=web-host&v="+Date.now(),{method:"GET",cache:"no-store",mode:"cors",credentials:"omit",headers:{Accept:"text/plain,text/html"}});
  if(!response.ok)throw Error("Serviço temporariamente indisponível ("+response.status+").");
  const page=await response.text();
  if(!/^\s*<!doctype\s+html/i.test(page)||!page.includes("crCutPreview")||!page.includes("crCutCommit"))throw Error("Interface incompleta. A operação financeira não foi liberada.");
  document.open();
  document.write(page);
  document.close();
 }catch(err){
  status.textContent="Não foi possível carregar o Dashboard: "+String(err.message||err)+". Nenhuma movimentação financeira ocorreu.";
  retry.hidden=false;
 }
}
retry.addEventListener("click",load);
load();
})();
</script>
</body>
</html>
